# ─────────────────────────────────────────────────────────────────────────────
# Mosquitto PQC Broker Configuration
#
# TLS 1.3 with ML-KEM key exchange via OpenSSL 3.5 + oqs-provider.
# Certificates provisioned by AWS Private CA.
# ─────────────────────────────────────────────────────────────────────────────

# ─── General ─────────────────────────────────────────────────────────────────
per_listener_settings true
persistence false
log_dest stdout
# log_type all covers connect/disconnect/subscribe/publish events; combined with
# connection_messages (client id + source IP) this makes every device's activity
# on THIS broker visible in CloudWatch /pqc-workshop/broker-container. Message
# payloads are captured separately by the message-logger IoT rules (mosquitto
# does not log payloads). ISO timestamps aid correlation with the dashboard.
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ─── PQC TLS Listener (port 8883) ───────────────────────────────────────────
listener 8883
protocol mqtt

# TLS configuration
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Require client certificates (mTLS)
require_certificate true
use_identity_as_username true

# TLS 1.3 only (required for PQC key exchange)
tls_version tlsv1.3

# Cipher suites — TLS 1.3 ciphersuites (key exchange is separate)
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# Key exchange groups — PQC hybrid + classical fallback
# Configured via OpenSSL 3.5 ssl.cnf (not a Mosquitto directive).
# OpenSSL 3.5 + oqs-provider supports these ML-KEM groups:
#   x25519_mlkem768, secp256r1_mlkem768, x448_mlkem1024
# Classical fallback for devices that don't support PQC:
#   X25519, P-256
# See /opt/openssl-pqc/ssl/openssl.cnf for the groups configuration.

# ─── Include bridge config if present ────────────────────────────────────────
include_dir /mosquitto/config/conf.d/
