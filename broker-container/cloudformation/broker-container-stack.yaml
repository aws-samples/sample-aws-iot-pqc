AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC MQTT Broker — Containerized Mosquitto with OpenSSL 3.5 + ML-KEM,
  running on ECS Fargate behind an NLB, with certificates from Private CA.
  Includes a CodeBuild pipeline to build the container image from S3 source.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the broker into

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Public subnets (>=2 AZs) for the internet-facing NLB. Devices connect to
      the NLB here on 8883 (classical) and 8884 (ML-DSA-44).

  TaskSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Private subnets (>=2 AZs) for the Fargate broker task. The task egresses
      to AWS IoT Core via a NAT gateway (no public IP), so it works under VPC
      Block Public Access (block-ingress). The VPC interface/S3 endpoints also
      attach here. When bringing your own VPC, pass private (NAT-routed) subnets;
      if you only have public subnets, pass the same values as SubnetIds.

  IoTEndpoint:
    Type: String
    Default: ''
    Description: >
      AWS IoT Core data endpoint (iot:Data-ATS) for the broker's IoT-Core
      bridge. Account-specific; resolve with
      `aws iot describe-endpoint --endpoint-type iot:Data-ATS`. In the master
      deploy this is passed down from the master IoTEndpoint parameter. If empty,
      the broker starts but the IoT-Core bridge is disabled.

  BrokerImageUri:
    Type: String
    Description: ECR image URI for the Mosquitto PQC container (auto-populated by build)
    Default: ''

  TriggerBuild:
    Type: String
    Description: Set to 'true' to trigger a CodeBuild run on stack create/update
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CreateVpcEndpoints:
    Type: String
    Description: >
      Create VPC interface endpoints (ECR api/dkr, Secrets Manager, CloudWatch
      Logs) + an S3 gateway endpoint so the Fargate broker task reaches AWS
      service APIs over private networking. Default 'false': the task runs in
      private subnets with NAT egress, which already reaches those AWS APIs over
      their public endpoints, making the interface endpoints redundant (~8 ENIs
      of cost). Set 'true' only if you must avoid NAT egress to the AWS APIs.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  RouteTableIds:
    Type: CommaDelimitedList
    Description: >
      Route table IDs for the S3 gateway endpoint (only used when
      CreateVpcEndpoints=true). Leave empty to skip the S3 gateway endpoint
      (image pulls then rely on the ECR interface endpoints + their DNS). For a
      default VPC pass the main route table id.
    Default: ''

Conditions:
  ShouldTriggerBuild: !Equals [!Ref TriggerBuild, 'true']
  MakeVpcEndpoints: !Equals [!Ref CreateVpcEndpoints, 'true']
  MakeS3Gateway: !And
    - !Condition MakeVpcEndpoints
    - !Not [!Equals [!Join ['', !Ref RouteTableIds], '']]

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # ECR Repository
  # ═══════════════════════════════════════════════════════════════════════════

  BrokerEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pqc-workshop-mosquitto-broker
      ImageScanningConfiguration:
        ScanOnPush: true

  # ═══════════════════════════════════════════════════════════════════════════
  # S3 Bucket — Source files for CodeBuild
  # ═══════════════════════════════════════════════════════════════════════════

  BrokerSourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'pqc-workshop-broker-source-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # CodeBuild — Build broker container image
  # ═══════════════════════════════════════════════════════════════════════════

  ImageBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-broker-image-builder
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/pqc-workshop-broker-image-build*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BrokerEcrRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt BrokerSourceBucket.Arn
                  - !Sub '${BrokerSourceBucket.Arn}/*'

  BrokerBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-broker-image-build
      Description: Builds the Mosquitto PQC broker container image
      ServiceRole: !GetAtt ImageBuilderRole.Arn
      # 60 min: the image compiles OpenSSL 3.5 + liboqs + oqs-provider +
      # mosquitto from source (~10-15 min) on top of an apt install that can be
      # slow on a flaky Ubuntu mirror. 30 min was too tight and timed out.
      TimeoutInMinutes: 60
      Source:
        Type: S3
        Location: !Sub '${BrokerSourceBucket}/broker-image/'
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPO_NAME
            Value: pqc-workshop-mosquitto-broker
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub '/aws/codebuild/pqc-workshop-broker-image-build'

  # ─── Build Trigger Lambda ──────────────────────────────────────────────────
  # Triggers CodeBuild as a Custom Resource on stack create/update

  BuildTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-broker-build-trigger
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TriggerBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BrokerBuildProject.Arn

  BuildTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-broker-build-trigger
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt BuildTriggerRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref BrokerBuildProject
      Code:
        ZipFile: |
          """
          Triggers a CodeBuild project and waits for completion.
          Used as a CloudFormation Custom Resource to build the broker image
          during stack deployment.
          """
          import boto3
          import time
          import os
          import cfnresponse

          codebuild = boto3.client('codebuild')

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  project = os.environ['PROJECT_NAME']
                  print(f"Starting build for project: {project}")

                  resp = codebuild.start_build(projectName=project)
                  build_id = resp['build']['id']
                  print(f"Build started: {build_id}")

                  # Poll for completion (max ~14 minutes to stay within Lambda timeout)
                  for _ in range(170):
                      time.sleep(5)
                      builds = codebuild.batch_get_builds(ids=[build_id])
                      status = builds['builds'][0]['buildStatus']
                      phase = builds['builds'][0].get('currentPhase', 'UNKNOWN')
                      print(f"  Status: {status}, Phase: {phase}")

                      if status == 'SUCCEEDED':
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              'BuildId': build_id,
                              'Status': 'SUCCEEDED'
                          })
                          return
                      elif status in ('FAILED', 'FAULT', 'TIMED_OUT', 'STOPPED'):
                          cfnresponse.send(event, context, cfnresponse.FAILED, {
                              'Error': f'Build {status}: {build_id}'
                          })
                          return

                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': f'Build timed out (Lambda timeout): {build_id}'
                  })
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  TriggerBrokerBuild:
    Type: Custom::TriggerBuild
    Condition: ShouldTriggerBuild
    DependsOn:
      - BrokerBuildProject
      - BrokerEcrRepository
    Properties:
      ServiceToken: !GetAtt BuildTriggerFunction.Arn
      # Change this value to force a rebuild on stack update
      BuildVersion: '1'

  # ═══════════════════════════════════════════════════════════════════════════
  # AWS Private CA — Certificate Authority
  # ═══════════════════════════════════════════════════════════════════════════

  PrivateCA:
    Type: AWS::ACMPCA::CertificateAuthority
    Properties:
      Type: ROOT
      KeyAlgorithm: EC_prime256v1
      SigningAlgorithm: SHA256WITHECDSA
      Subject:
        CommonName: PQC Workshop Private CA
        Organization: AWS PQC Workshop
        Country: US
      RevocationConfiguration:
        CrlConfiguration:
          Enabled: false

  PrivateCACertificate:
    Type: AWS::ACMPCA::Certificate
    Properties:
      CertificateAuthorityArn: !Ref PrivateCA
      CertificateSigningRequest: !GetAtt PrivateCA.CertificateSigningRequest
      SigningAlgorithm: SHA256WITHECDSA
      TemplateArn: arn:aws:acm-pca:::template/RootCACertificate/V1
      Validity:
        Type: YEARS
        Value: 10

  PrivateCAActivation:
    Type: AWS::ACMPCA::CertificateAuthorityActivation
    Properties:
      CertificateAuthorityArn: !Ref PrivateCA
      Certificate: !GetAtt PrivateCACertificate.Certificate
      Status: ACTIVE

  # ═══════════════════════════════════════════════════════════════════════════
  # AWS Private CA — Post-Quantum ML-DSA-44 Certificate Authority (Step 2)
  # ═══════════════════════════════════════════════════════════════════════════
  # Runs in PARALLEL with the classical CA above. ML-DSA-44 (FIPS 204, NIST
  # Level 2) is a post-quantum signature algorithm. ACM PCA added ML-DSA support
  # in Nov 2025. Same ROOT type + RootCACertificate/V1 template as the classical
  # CA — only KeyAlgorithm / SigningAlgorithm change (ML-DSA has no hash suffix).

  MlDsaPrivateCA:
    Type: AWS::ACMPCA::CertificateAuthority
    Properties:
      Type: ROOT
      KeyAlgorithm: ML_DSA_44
      SigningAlgorithm: ML_DSA_44
      Subject:
        CommonName: PQC Workshop ML-DSA-44 Private CA
        Organization: AWS PQC Workshop
        Country: US
      RevocationConfiguration:
        CrlConfiguration:
          Enabled: false

  MlDsaPrivateCACertificate:
    Type: AWS::ACMPCA::Certificate
    Properties:
      CertificateAuthorityArn: !Ref MlDsaPrivateCA
      CertificateSigningRequest: !GetAtt MlDsaPrivateCA.CertificateSigningRequest
      SigningAlgorithm: ML_DSA_44
      TemplateArn: arn:aws:acm-pca:::template/RootCACertificate/V1
      Validity:
        Type: YEARS
        Value: 10

  MlDsaPrivateCAActivation:
    Type: AWS::ACMPCA::CertificateAuthorityActivation
    Properties:
      CertificateAuthorityArn: !Ref MlDsaPrivateCA
      Certificate: !GetAtt MlDsaPrivateCACertificate.Certificate
      Status: ACTIVE

  # ─── Broker Certificate (issued by Private CA via Lambda custom resource) ──
  # The CertProvisionerFunction generates a key, CSR, issues the cert from
  # Private CA, and stores everything in Secrets Manager automatically.

  # ═══════════════════════════════════════════════════════════════════════════
  # Secrets Manager — Store broker cert and key
  # ═══════════════════════════════════════════════════════════════════════════

  BrokerCACertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/ca-cert
      Description: Private CA certificate for the PQC MQTT broker

  BrokerCertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/broker-cert
      Description: Broker TLS certificate (issued by Private CA)

  BrokerKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/broker-key
      Description: Broker TLS private key

  # ─── ML-DSA-44 broker cert secrets (Step 2, for the 8884 listener) ──────────
  MlDsaBrokerCACertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/mldsa-ca-cert
      Description: ML-DSA-44 Private CA certificate (device trust root for 8884)

  MlDsaBrokerCertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/mldsa-broker-cert
      Description: ML-DSA-44 broker TLS certificate (issued by ML-DSA-44 Private CA)

  MlDsaBrokerKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/mldsa-broker-key
      Description: ML-DSA-44 broker TLS private key

  # ─── OTA firmware SIGNER cert secrets (one STABLE signer per era) ───────────
  # These are the stable per-era firmware-signing identities, distinct from the
  # broker TLS certs and the per-device certs. The classical signer (ECDSA P-256,
  # classical CA) signs OTA images for the 2.0.0/3.0.0 era; the ML-DSA-44 signer
  # (ML-DSA CA) signs the 4.0.0+ era. The firmware build READS the signer key to
  # sign firmware.bin; the device verifies the signature against the signer leaf
  # delivered with the OTA, which chains to the baked-in CA root. One signer per
  # era (not per build/device), so the device trusts a single leaf per era.
  SignerClassicalCACertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/signer-classical-ca
      Description: Classical CA cert for the firmware signer (device trust root, 2.0.0/3.0.0 era)

  SignerClassicalCertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/signer-classical-cert
      Description: Classical ECDSA-P256 firmware signer certificate (leaf, ships with OTA)

  SignerClassicalKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/signer-classical-key
      Description: Classical ECDSA-P256 firmware signer private key (read by the build to sign)

  SignerMlDsaCACertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/signer-mldsa-ca
      Description: ML-DSA-44 CA cert for the firmware signer (device trust root, 4.0.0+ era)

  SignerMlDsaCertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/signer-mldsa-cert
      Description: ML-DSA-44 firmware signer certificate (leaf, ships with OTA)

  SignerMlDsaKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/signer-mldsa-key
      Description: ML-DSA-44 firmware signer private key (read by the build to sign)

  # ═══════════════════════════════════════════════════════════════════════════
  # ECS — Cluster, Task Definition, Service
  # ═══════════════════════════════════════════════════════════════════════════

  BrokerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: pqc-workshop-broker
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  BrokerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-broker-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BrokerTaskPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref BrokerCACertSecret
                  - !Ref BrokerCertSecret
                  - !Ref BrokerKeySecret
                  - !Ref BridgeCertSecret
                  - !Ref BridgeKeySecret
                  - !Ref BridgeRootCASecret
                  # ML-DSA-44 broker cert secrets for the 8884 listener (Step 2)
                  - !Ref MlDsaBrokerCACertSecret
                  - !Ref MlDsaBrokerCertSecret
                  - !Ref MlDsaBrokerKeySecret
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  BrokerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-broker-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRPull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BrokerEcrRepository.Arn

  BrokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /pqc-workshop/broker-container
      RetentionInDays: 7

  BrokerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pqc-workshop-broker
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt BrokerExecutionRole.Arn
      TaskRoleArn: !GetAtt BrokerTaskRole.Arn
      ContainerDefinitions:
        - Name: mosquitto-pqc
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-mosquitto-broker:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 8883
              Protocol: tcp
            # ML-DSA-44 device listener (Step 2)
            - ContainerPort: 8884
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CA_CERT_SECRET
              Value: !Ref BrokerCACertSecret
            - Name: BROKER_CERT_SECRET
              Value: !Ref BrokerCertSecret
            - Name: BROKER_KEY_SECRET
              Value: !Ref BrokerKeySecret
            # ML-DSA-44 broker cert secrets for the 8884 listener (Step 2)
            - Name: MLDSA_CA_CERT_SECRET
              Value: !Ref MlDsaBrokerCACertSecret
            - Name: MLDSA_BROKER_CERT_SECRET
              Value: !Ref MlDsaBrokerCertSecret
            - Name: MLDSA_BROKER_KEY_SECRET
              Value: !Ref MlDsaBrokerKeySecret
            - Name: IOT_ENDPOINT
              Value: !Ref IoTEndpoint
            - Name: BROKER_NAME
              Value: pqc-workshop-broker
            - Name: BRIDGE_CERT_SECRET
              Value: !Ref BridgeCertSecret
            - Name: BRIDGE_KEY_SECRET
              Value: !Ref BridgeKeySecret
            - Name: BRIDGE_ROOT_CA_SECRET
              Value: !Ref BridgeRootCASecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BrokerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mosquitto

  # ═══════════════════════════════════════════════════════════════════════════
  # Network Load Balancer — TCP passthrough (preserves PQC TLS handshake)
  # ═══════════════════════════════════════════════════════════════════════════

  BrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PQC MQTT Broker - allow ports 8883 (classical) and 8884 (ML-DSA-44)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8883
          ToPort: 8883
          CidrIp: 0.0.0.0/0
        # ML-DSA-44 device listener (Step 2). Same public reachability as 8883.
        - IpProtocol: tcp
          FromPort: 8884
          ToPort: 8884
          CidrIp: 0.0.0.0/0

  # ═══════════════════════════════════════════════════════════════════════════
  # VPC Endpoints — let the Fargate task reach ECR / Secrets Manager / Logs over
  # private AWS networking instead of depending on public egress to the APIs.
  # ECR image pulls need ecr.api + ecr.dkr (interface) AND S3 (gateway, for the
  # image layers). Secrets Manager + Logs cover cert fetch and the awslogs driver.
  # ═══════════════════════════════════════════════════════════════════════════
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: MakeVpcEndpoints
    Properties:
      GroupDescription: HTTPS to VPC interface endpoints (from broker tasks)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref BrokerSecurityGroup

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: MakeVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref TaskSubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: MakeVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref TaskSubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: MakeVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref TaskSubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: MakeVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref TaskSubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: MakeS3Gateway
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  BrokerNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: pqc-broker-nlb
      Type: network
      Scheme: internet-facing
      Subnets: !Ref SubnetIds

  BrokerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: pqc-broker-tg
      Port: 8883
      Protocol: TCP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: TCP
      HealthCheckPort: '8883'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  BrokerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BrokerNLB
      Port: 8883
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BrokerTargetGroup

  # ─── ML-DSA-44 target group + listener on 8884 (Step 2) ─────────────────────
  # Same NLB, TCP passthrough (preserves the PQC TLS handshake end to end to the
  # broker). Health-checks the 8884 listener directly.
  MlDsaBrokerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: pqc-broker-mldsa-tg
      Port: 8884
      Protocol: TCP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: TCP
      HealthCheckPort: '8884'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  MlDsaBrokerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref BrokerNLB
      Port: 8884
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref MlDsaBrokerTargetGroup

  # ─── ECS Service ───────────────────────────────────────────────────────────

  BrokerService:
    Type: AWS::ECS::Service
    DependsOn:
      - BrokerListener
      - MlDsaBrokerListener
    Properties:
      ServiceName: pqc-workshop-broker
      Cluster: !Ref BrokerCluster
      TaskDefinition: !Ref BrokerTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Private subnets + NAT egress (no public IP). A public-IP task would
          # rely on IGW return traffic, which VPC Block Public Access
          # (block-ingress) drops — breaking the broker->IoT Core bridge.
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref BrokerSecurityGroup
          Subnets: !Ref TaskSubnetIds
      LoadBalancers:
        - ContainerName: mosquitto-pqc
          ContainerPort: 8883
          TargetGroupArn: !Ref BrokerTargetGroup
        # ML-DSA-44 device listener (Step 2)
        - ContainerName: mosquitto-pqc
          ContainerPort: 8884
          TargetGroupArn: !Ref MlDsaBrokerTargetGroup

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Certificate Provisioner (generates broker CSR + stores certs)
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Shared cert-issuer container image (OpenSSL 3.5 + ACM PCA) ─────────────
  # The ONE image that mints every workshop TLS cert. Here it backs the broker
  # cert provisioner (container-image Lambda below); the firmware CodeBuild bakes
  # the same issue_cert.py script into its own image. Built in-stack by CodeBuild
  # (mirrors the broker image build) so a from-scratch deploy needs no manual step.
  CertIssuerEcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: pqc-workshop-cert-issuer
      ImageScanningConfiguration:
        ScanOnPush: true

  CertIssuerBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-cert-issuer-build
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CertIssuerBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt CertIssuerEcrRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt BrokerSourceBucket.Arn
                  - !Sub '${BrokerSourceBucket.Arn}/*'

  CertIssuerBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-cert-issuer-image-build
      Description: Builds the shared cert-issuer container image (OpenSSL 3.5 + ACM PCA)
      ServiceRole: !GetAtt CertIssuerBuildRole.Arn
      # Compiles OpenSSL 3.5 from source (~3-5 min) on top of the Lambda base.
      TimeoutInMinutes: 30
      Source:
        Type: S3
        Location: !Sub '${BrokerSourceBucket}/cert-issuer/'
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPO_NAME
            Value: pqc-workshop-cert-issuer
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub '/aws/codebuild/pqc-workshop-cert-issuer-image-build'

  # Reuses the shared BuildTriggerFunction pattern via its own custom resource.
  TriggerCertIssuerBuild:
    Type: Custom::TriggerBuild
    Condition: ShouldTriggerBuild
    DependsOn:
      - CertIssuerBuildProject
      - CertIssuerEcrRepository
    Properties:
      ServiceToken: !GetAtt CertIssuerBuildTriggerFunction.Arn
      BuildVersion: '1'

  CertIssuerBuildTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-cert-issuer-build-trigger
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TriggerBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt CertIssuerBuildProject.Arn

  CertIssuerBuildTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-cert-issuer-build-trigger
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt CertIssuerBuildTriggerRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref CertIssuerBuildProject
      Code:
        ZipFile: |
          """Triggers the cert-issuer image CodeBuild and waits for completion."""
          import boto3
          import os
          import time
          import cfnresponse

          codebuild = boto3.client('codebuild')

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  project = os.environ['PROJECT_NAME']
                  resp = codebuild.start_build(projectName=project)
                  build_id = resp['build']['id']
                  print(f"Cert-issuer image build started: {build_id}")

                  for _ in range(170):
                      time.sleep(5)
                      builds = codebuild.batch_get_builds(ids=[build_id])
                      status = builds['builds'][0]['buildStatus']
                      print(f"  Status: {status}")
                      if status == 'SUCCEEDED':
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {'BuildId': build_id})
                          return
                      if status in ('FAILED', 'FAULT', 'TIMED_OUT', 'STOPPED'):
                          cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': f'Build {status}: {build_id}'})
                          return
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': f'Build timed out: {build_id}'})
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # ─── Broker Certificate Provisioner (CodeBuild job) ─────────────────────────
  # Mints BOTH broker server certs (classical + ML-DSA-44) via the shared
  # cert-issuer image (issue_broker_certs.py) and stores them in Secrets Manager.
  # Runs as a CodeBuild job — NOT a container-image Lambda — so it fits the deploy
  # model (stack created first with no images; images built + values filled in
  # post-stack). The deploy script triggers this AFTER the cert-issuer image is
  # built and BOTH CAs are ACTIVE. The same shape drops into the future
  # registration Step Function via codebuild:startBuild.sync.
  CertProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-cert-provisioner
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CertProvisionerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt CertIssuerEcrRepository.Arn
              - Effect: Allow
                Action:
                  - acm-pca:IssueCertificate
                  - acm-pca:GetCertificate
                  - acm-pca:GetCertificateAuthorityCertificate
                Resource:
                  - !Ref PrivateCA
                  - !Ref MlDsaPrivateCA
              - Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Ref BrokerCACertSecret
                  - !Ref BrokerCertSecret
                  - !Ref BrokerKeySecret
                  - !Ref MlDsaBrokerCACertSecret
                  - !Ref MlDsaBrokerCertSecret
                  - !Ref MlDsaBrokerKeySecret
                  - !Ref SignerClassicalCACertSecret
                  - !Ref SignerClassicalCertSecret
                  - !Ref SignerClassicalKeySecret
                  - !Ref SignerMlDsaCACertSecret
                  - !Ref SignerMlDsaCertSecret
                  - !Ref SignerMlDsaKeySecret
              # CodeBuild reads its build source from S3, so it needs both
              # GetObject (on the objects) and ListBucket (on the bucket) — the
              # same grant CertIssuerBuildRole has. Without ListBucket the
              # provisioner fails DOWNLOAD_SOURCE with AccessDenied.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt BrokerSourceBucket.Arn
                  - !Sub '${BrokerSourceBucket.Arn}/*'

  BrokerCertProvisionerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-broker-cert-provisioner
      Description: Mints both broker server certs (classical + ML-DSA-44) into Secrets Manager
      ServiceRole: !GetAtt CertProvisionerRole.Arn
      TimeoutInMinutes: 15
      Source:
        Type: S3
        Location: !Sub '${BrokerSourceBucket}/cert-issuer/'
        BuildSpec: buildspec-broker-certs.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        # Runs INSIDE the shared cert-issuer image (has OpenSSL 3.5 + issuer code).
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-cert-issuer:latest'
        ImagePullCredentialsType: SERVICE_ROLE
        EnvironmentVariables:
          - Name: CLASSICAL_CA_ARN
            Value: !Ref PrivateCA
          - Name: MLDSA_CA_ARN
            Value: !Ref MlDsaPrivateCA
          - Name: BROKER_CA_CERT_SECRET
            Value: !Ref BrokerCACertSecret
          - Name: BROKER_CERT_SECRET
            Value: !Ref BrokerCertSecret
          - Name: BROKER_KEY_SECRET
            Value: !Ref BrokerKeySecret
          - Name: MLDSA_CA_CERT_SECRET
            Value: !Ref MlDsaBrokerCACertSecret
          - Name: MLDSA_BROKER_CERT_SECRET
            Value: !Ref MlDsaBrokerCertSecret
          - Name: MLDSA_BROKER_KEY_SECRET
            Value: !Ref MlDsaBrokerKeySecret
          - Name: BROKER_CN
            Value: pqc-mqtt-broker
          # ── OTA firmware signer secrets (stable per-era signing identity) ──
          - Name: SIGNER_CLASSICAL_CA_SECRET
            Value: !Ref SignerClassicalCACertSecret
          - Name: SIGNER_CLASSICAL_CERT_SECRET
            Value: !Ref SignerClassicalCertSecret
          - Name: SIGNER_CLASSICAL_KEY_SECRET
            Value: !Ref SignerClassicalKeySecret
          - Name: SIGNER_MLDSA_CA_SECRET
            Value: !Ref SignerMlDsaCACertSecret
          - Name: SIGNER_MLDSA_CERT_SECRET
            Value: !Ref SignerMlDsaCertSecret
          - Name: SIGNER_MLDSA_KEY_SECRET
            Value: !Ref SignerMlDsaKeySecret
          - Name: SIGNER_CN
            Value: pqc-firmware-signer
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub '/aws/codebuild/pqc-workshop-broker-cert-provisioner'

  # ═══════════════════════════════════════════════════════════════════════════
  # IoT Core Bridge — Thing, Certificate, Policy for Mosquitto→IoT Core bridge
  # ═══════════════════════════════════════════════════════════════════════════

  # Secrets to hold the IoT Core bridge credentials
  BridgeCertSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/bridge-cert
      Description: IoT Core certificate for Mosquitto bridge

  BridgeKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/bridge-key
      Description: IoT Core private key for Mosquitto bridge

  BridgeRootCASecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pqc-broker/bridge-root-ca
      Description: Amazon Root CA for IoT Core TLS

  # Lambda to provision IoT Core Thing + Certificate + Policy and store in Secrets Manager
  BridgeProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-bridge-provisioner
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BridgeProvisionerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateThing
                  - iot:CreateKeysAndCertificate
                  - iot:CreatePolicy
                  - iot:AttachThingPrincipal
                  - iot:AttachPolicy
                  - iot:DescribeEndpoint
                  - iot:DeleteThing
                  - iot:DeleteCertificate
                  - iot:DeletePolicy
                  - iot:DetachThingPrincipal
                  - iot:DetachPolicy
                  - iot:UpdateCertificate
                  - iot:ListThingPrincipals
                  - iot:ListTargetsForPolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Ref BridgeCertSecret
                  - !Ref BridgeKeySecret
                  - !Ref BridgeRootCASecret

  BridgeProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-bridge-provisioner
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt BridgeProvisionerRole.Arn
      Environment:
        Variables:
          BRIDGE_CERT_SECRET: !Ref BridgeCertSecret
          BRIDGE_KEY_SECRET: !Ref BridgeKeySecret
          BRIDGE_ROOT_CA_SECRET: !Ref BridgeRootCASecret
          IOT_ENDPOINT: !Ref IoTEndpoint
      Code:
        ZipFile: |
          """
          Provisions an IoT Core Thing with certificate for the Mosquitto bridge.
          Creates: Thing, Certificate, Policy, stores creds in Secrets Manager.
          """
          import boto3
          import os
          import json
          import urllib.request
          import cfnresponse

          iot = boto3.client('iot')
          secrets = boto3.client('secretsmanager')

          THING_NAME = 'pqc-workshop-broker-bridge'
          POLICY_NAME = 'pqc-workshop-broker-bridge-policy'
          AMAZON_ROOT_CA_URL = 'https://www.amazontrust.com/repository/AmazonRootCA1.pem'

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      # Clean up IoT resources
                      try:
                          cleanup_iot_resources()
                      except Exception as e:
                          print(f"Cleanup warning: {e}")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  region = os.environ.get('AWS_REGION', 'us-east-1')
                  account_id = context.invoked_function_arn.split(':')[4]

                  # Step 1: Create IoT Thing
                  print(f"Creating IoT Thing: {THING_NAME}")
                  try:
                      iot.create_thing(thingName=THING_NAME)
                  except iot.exceptions.ResourceAlreadyExistsException:
                      print(f"Thing {THING_NAME} already exists")

                  # Step 2: Create keys and certificate
                  print("Creating IoT certificate...")
                  cert_resp = iot.create_keys_and_certificate(setAsActive=True)
                  cert_arn = cert_resp['certificateArn']
                  cert_id = cert_resp['certificateId']
                  cert_pem = cert_resp['certificatePem']
                  key_pem = cert_resp['keyPair']['PrivateKey']
                  print(f"Certificate created: {cert_id}")

                  # Step 3: Create IoT Policy (allows bridge pub/sub)
                  print(f"Creating IoT Policy: {POLICY_NAME}")
                  policy_doc = {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Effect": "Allow",
                              "Action": "iot:Connect",
                              "Resource": f"arn:aws:iot:{region}:{account_id}:client/{THING_NAME}*"
                          },
                          {
                              "Effect": "Allow",
                              "Action": "iot:Publish",
                              "Resource": [
                                  f"arn:aws:iot:{region}:{account_id}:topic/dt/*",
                                  f"arn:aws:iot:{region}:{account_id}:topic/$aws/things/*/shadow/*"
                              ]
                          },
                          {
                              "Effect": "Allow",
                              "Action": "iot:Subscribe",
                              "Resource": [
                                  f"arn:aws:iot:{region}:{account_id}:topicfilter/cmd/*",
                                  f"arn:aws:iot:{region}:{account_id}:topicfilter/$aws/things/*/shadow/*"
                              ]
                          },
                          {
                              "Effect": "Allow",
                              "Action": "iot:Receive",
                              "Resource": [
                                  f"arn:aws:iot:{region}:{account_id}:topic/cmd/*",
                                  f"arn:aws:iot:{region}:{account_id}:topic/$aws/things/*/shadow/*"
                              ]
                          }
                      ]
                  }
                  try:
                      iot.create_policy(
                          policyName=POLICY_NAME,
                          policyDocument=json.dumps(policy_doc)
                      )
                  except iot.exceptions.ResourceAlreadyExistsException:
                      print(f"Policy {POLICY_NAME} already exists")

                  # Step 4: Attach policy and thing to certificate
                  iot.attach_policy(policyName=POLICY_NAME, target=cert_arn)
                  iot.attach_thing_principal(thingName=THING_NAME, principal=cert_arn)
                  print("Policy and Thing attached to certificate")

                  # Step 5: Download Amazon Root CA
                  print("Downloading Amazon Root CA...")
                  root_ca = urllib.request.urlopen(AMAZON_ROOT_CA_URL).read().decode()

                  # Step 6: Store in Secrets Manager
                  print("Storing credentials in Secrets Manager...")
                  secrets.put_secret_value(
                      SecretId=os.environ['BRIDGE_CERT_SECRET'],
                      SecretString=cert_pem
                  )
                  secrets.put_secret_value(
                      SecretId=os.environ['BRIDGE_KEY_SECRET'],
                      SecretString=key_pem
                  )
                  secrets.put_secret_value(
                      SecretId=os.environ['BRIDGE_ROOT_CA_SECRET'],
                      SecretString=root_ca
                  )

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'ThingName': THING_NAME,
                      'CertificateArn': cert_arn,
                      'CertificateId': cert_id
                  })

              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

          def cleanup_iot_resources():
              """Best-effort cleanup of IoT resources on stack deletion."""
              # List and detach principals from thing
              try:
                  principals = iot.list_thing_principals(thingName=THING_NAME)
                  for principal in principals.get('principals', []):
                      iot.detach_thing_principal(thingName=THING_NAME, principal=principal)
                      cert_id = principal.split('/')[-1]
                      # Detach policies
                      targets = iot.list_targets_for_policy(policyName=POLICY_NAME)
                      for target in targets.get('targets', []):
                          iot.detach_policy(policyName=POLICY_NAME, target=target)
                      # Deactivate and delete cert
                      iot.update_certificate(certificateId=cert_id, newStatus='INACTIVE')
                      iot.delete_certificate(certificateId=cert_id)
              except Exception as e:
                  print(f"Principal cleanup: {e}")
              # Delete policy and thing
              try:
                  iot.delete_policy(policyName=POLICY_NAME)
              except Exception as e:
                  print(f"Policy delete: {e}")
              try:
                  iot.delete_thing(thingName=THING_NAME)
              except Exception as e:
                  print(f"Thing delete: {e}")

  # Trigger bridge provisioning
  ProvisionBridge:
    Type: Custom::ProvisionBridge
    Properties:
      ServiceToken: !GetAtt BridgeProvisionerFunction.Arn

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  BrokerEndpoint:
    Description: NLB endpoint for MQTT connections
    Value: !GetAtt BrokerNLB.DNSName

  BrokerPort:
    Description: MQTT TLS port (classical / ECDSA)
    Value: '8883'

  BrokerMlDsaPort:
    Description: MQTT TLS port for the ML-DSA-44 listener (Step 2)
    Value: '8884'

  PrivateCAArn:
    Description: Private CA ARN (for issuing device certificates)
    Value: !Ref PrivateCA

  MlDsaPrivateCAArn:
    Description: ML-DSA-44 Private CA ARN (for issuing post-quantum device certificates)
    Value: !Ref MlDsaPrivateCA

  # ─── OTA firmware signer secret ARNs (consumed by the device-builder stack) ──
  # The firmware build reads the era-appropriate signer KEY to sign firmware.bin
  # and the signer CERT to ship alongside the OTA. Export the ARNs so the build's
  # CodeBuild role can be scoped to exactly these secrets.
  SignerClassicalCACertSecretArn:
    Description: ARN of the classical firmware-signer CA cert secret (device trust root, 2.0.0/3.0.0)
    Value: !Ref SignerClassicalCACertSecret

  SignerClassicalCertSecretArn:
    Description: ARN of the classical ECDSA-P256 firmware-signer leaf cert secret
    Value: !Ref SignerClassicalCertSecret

  SignerClassicalKeySecretArn:
    Description: ARN of the classical ECDSA-P256 firmware-signer private key secret
    Value: !Ref SignerClassicalKeySecret

  SignerMlDsaCACertSecretArn:
    Description: ARN of the ML-DSA-44 firmware-signer CA cert secret (device trust root, 4.0.0+)
    Value: !Ref SignerMlDsaCACertSecret

  SignerMlDsaCertSecretArn:
    Description: ARN of the ML-DSA-44 firmware-signer leaf cert secret
    Value: !Ref SignerMlDsaCertSecret

  SignerMlDsaKeySecretArn:
    Description: ARN of the ML-DSA-44 firmware-signer private key secret
    Value: !Ref SignerMlDsaKeySecret

  ECRRepositoryUri:
    Description: ECR repository for broker image
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-mosquitto-broker'

  BrokerClusterName:
    Description: ECS cluster name
    Value: !Ref BrokerCluster

  BrokerSourceBucketName:
    Description: S3 bucket for broker Docker source files
    Value: !Ref BrokerSourceBucket

  CodeBuildProjectName:
    Description: CodeBuild project for building broker image
    Value: !Ref BrokerBuildProject

  CertIssuerImageBuildProject:
    Description: CodeBuild project that builds the shared cert-issuer image
    Value: !Ref CertIssuerBuildProject

  BrokerCertProvisionerProjectName:
    Description: CodeBuild project that mints both broker server certs into Secrets Manager
    Value: !Ref BrokerCertProvisionerProject
