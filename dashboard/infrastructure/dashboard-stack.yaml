AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop Dashboard infrastructure. Creates DynamoDB, AppSync API,
  Lambdas for telemetry processing and command publishing, IoT Rules,
  Cognito for unauthenticated access, and S3/CloudFront for hosting.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  DeviceCount:
    Type: Number
    Default: 100
    Description: Number of ESP32 devices to pre-provision (1-100)
    MinValue: 1
    MaxValue: 100

  DeviceNamePrefix:
    Type: String
    Default: esp32-pqc-device
    Description: Prefix for device Thing names (e.g., esp32-pqc-device-001)

  StartMigrationFunctionArn:
    Type: String
    Description: >
      ARN of the StartMigration Lambda (created by the device-builder stack).
      The master stack passes this in from DeviceBuilderStack.Outputs so the
      migrateFirmware resolver can invoke it. Passing the ARN as a resolvable
      cross-stack value (instead of hardcoding it) is required so CloudFormation
      early validation (AWS::EarlyValidation::ResourceExistenceCheck) sees the
      function as an existing dependency at change-set time.

  DashboardTriggerBuild:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Whether this stack builds + deploys the v2 dashboard via CodeBuild during
      stack create/update. Kept 'false' for the orchestrated deploy: the build
      source (the Vite frontend) must be uploaded to the dashboard source bucket
      AFTER the bucket exists, so deploy-workshop.sh stages the source and
      triggers the dashboard build as a post-deploy step (mirroring how the
      broker image is built). Set 'true' only if the source is already staged
      before deploy.

# ─────────────────────────────────────────────────────────────────────────────
# Conditions
# ─────────────────────────────────────────────────────────────────────────────
Conditions:
  ShouldTriggerDashboardBuild: !Equals [!Ref DashboardTriggerBuild, 'true']

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # DynamoDB — Device State Table
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "workshop depends on fixed resource names referenced across stacks/scripts"
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: "encrypted with the AWS-owned/managed DynamoDB key (SSEEnabled); a customer-managed CMK is out of scope for the workshop sample"
    Properties:
      TableName: pqc-workshop-devices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: thingName
          AttributeType: S
      KeySchema:
        - AttributeName: thingName
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Cognito — Unauthenticated Access for Dashboard
  # ═══════════════════════════════════════════════════════════════════════════

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W57
            reason: "intentional: public read-only workshop dashboard uses unauthenticated Cognito identities with a restrictive unauth role"
      checkov:
        skip:
          - id: CKV_AWS_366
            comment: "intentional: public read-only workshop dashboard uses unauthenticated Cognito identities with a restrictive unauth role"
    Properties:
      IdentityPoolName: pqc_workshop_dashboard
      AllowUnauthenticatedIdentities: true

  CognitoUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName: let CloudFormation auto-generate a unique name.
      # Fixed role names collide on repeated deploys in a shared account (early
      # validation resource-name-conflict). Referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: AppSyncAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource:
                  - !Sub '${DeviceApi.Arn}/*'

  CognitoRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        unauthenticated: !GetAtt CognitoUnauthRole.Arn

  # ═══════════════════════════════════════════════════════════════════════════
  # AppSync — GraphQL API
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceApi:
    Type: AWS::AppSync::GraphQLApi
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_193
            comment: "workshop sample"
          - id: CKV_AWS_194
            comment: "workshop sample"
          - id: CKV2_AWS_33
            comment: "workshop sample"
    Properties:
      Name: pqc-workshop-device-api
      AuthenticationType: AWS_IAM
      XrayEnabled: false

  DeviceApiSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      Definition: |
        type Device {
          thingName: String!
          status: String
          firmwareVersion: String
          pqcAlgorithm: String
          tlsVersion: String
          certSigAlg: String
          otaSigAlg: String
          firmwareSha256: String
          wifiRssi: Int
          freeHeap: Int
          heapTotal: Int
          minHeap: Int
          maxAllocHeap: Int
          sketchSize: Int
          freeSketchSpace: Int
          psramSize: Int
          psramFree: Int
          chipTempC: Float
          ipAddress: String
          uptimeSec: Int
          messageId: Int
          lastSeen: String
          migrationStatus: String
          migrationError: String
        }

        type MessageLogEntry {
          thingName: String!
          timestamp: String!
          topic: String
          direction: String
          payload: String
        }

        type BrokerLogEntry {
          timestamp: String
          message: String
        }

        type BrokerLogResult {
          entries: [BrokerLogEntry]
          count: Int
          message: String
        }

        type CommandResult {
          success: Boolean!
          message: String
          thingName: String!
        }

        type DeleteResult {
          success: Boolean!
          thingName: String!
        }

        type Query {
          listDevices: [Device]
          getDevice(thingName: String!): Device
          getDeviceLog(thingName: String!, limit: Int): [MessageLogEntry]
          getBrokerLog(thingName: String, limit: Int): BrokerLogResult
        }

        type Mutation {
          updateDevice(input: UpdateDeviceInput!): Device
          migrateFirmware(thingName: String!, variant: String): CommandResult
          deleteDevice(thingName: String!): DeleteResult
          sendCommand(thingName: String!, action: String!, topicSuffix: String): CommandResult
        }

        input UpdateDeviceInput {
          thingName: String!
          status: String
          firmwareVersion: String
          pqcAlgorithm: String
          tlsVersion: String
          certSigAlg: String
          otaSigAlg: String
          firmwareSha256: String
          wifiRssi: Int
          freeHeap: Int
          heapTotal: Int
          minHeap: Int
          maxAllocHeap: Int
          sketchSize: Int
          freeSketchSpace: Int
          psramSize: Int
          psramFree: Int
          chipTempC: Float
          ipAddress: String
          uptimeSec: Int
          messageId: Int
          lastSeen: String
        }

        type Subscription {
          onDeviceUpdate(thingName: String): Device
            @aws_subscribe(mutations: ["updateDevice"])
        }

        schema {
          query: Query
          mutation: Mutation
          subscription: Subscription
        }

  # ─── AppSync Data Source: DynamoDB ─────────────────────────────────────────

  AppSyncDynamoRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DeviceTable.Arn

  DynamoDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      Name: DeviceTableSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        AwsRegion: !Ref AWS::Region
        TableName: !Ref DeviceTable

  # ─── AppSync Data Source: Lambda (for migrate command) ─────────────────────

  AppSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CommandPublisherFunction.Arn
                  # The StartMigration Lambda is defined in the device-builder
                  # stack; its ARN is passed in as a resolvable cross-stack
                  # parameter (StartMigrationFunctionArn) rather than hardcoded,
                  # so early validation treats it as an existing dependency. The
                  # migrateFirmware resolver invokes it to start the PQC migration
                  # Step Functions workflow (returns immediately).
                  - !Ref StartMigrationFunctionArn

  LambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      Name: CommandPublisherSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CommandPublisherFunction.Arn

  # Data source for the StartMigration Lambda (device-builder stack). Used by the
  # migrateFirmware resolver: the "Migrate to PQC" button starts the Step
  # Functions migration workflow and returns immediately (no 30s timeout).
  StartMigrationDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      Name: StartMigrationSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncLambdaRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !Ref StartMigrationFunctionArn

  # ─── AppSync Resolvers ─────────────────────────────────────────────────────

  ListDevicesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      TypeName: Query
      FieldName: listDevices
      DataSourceName: !GetAtt DynamoDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          // Only surface devices that were REGISTERED through the builder-Pi.
          // The registrar writes `serialNumber`; a device that merely publishes
          // telemetry (e.g. a board left flashed from a previous deployment)
          // has no such attribute, so filtering on its existence keeps ghost
          // devices off the dashboard even if a row leaks into the table.
          return {
            operation: 'Scan',
            filter: {
              expression: 'attribute_exists(serialNumber)',
            },
          };
        }
        export function response(ctx) {
          return ctx.result.items;
        }
    DependsOn: DeviceApiSchema

  GetDeviceResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      TypeName: Query
      FieldName: getDevice
      DataSourceName: !GetAtt DynamoDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          return {
            operation: 'GetItem',
            key: util.dynamodb.toMapValues({ thingName: ctx.args.thingName })
          };
        }
        export function response(ctx) {
          return ctx.result;
        }
    DependsOn: DeviceApiSchema

  UpdateDeviceResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      TypeName: Mutation
      FieldName: updateDevice
      DataSourceName: !GetAtt DynamoDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          const input = ctx.args.input;
          const expNames = {};
          const expValues = {};
          const expParts = [];
          Object.keys(input).forEach((key) => {
            if (key !== 'thingName') {
              expNames[`#${key}`] = key;
              expValues[`:${key}`] = util.dynamodb.toDynamoDB(input[key]);
              expParts.push(`#${key} = :${key}`);
            }
          });
          return {
            operation: 'UpdateItem',
            key: util.dynamodb.toMapValues({ thingName: input.thingName }),
            update: {
              expression: `SET ${expParts.join(', ')}`,
              expressionNames: expNames,
              expressionValues: expValues
            }
          };
        }
        export function response(ctx) {
          return ctx.result;
        }
    DependsOn: DeviceApiSchema

  MigrateFirmwareResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      TypeName: Mutation
      FieldName: migrateFirmware
      # Targets the StartMigration Lambda, which starts the Step Functions
      # migration workflow and returns immediately.
      DataSourceName: !GetAtt StartMigrationDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          // Forward the optional firmware variant from the dashboard picker
          // (classical / pqc / pqc-mldsa). StartMigration defaults it to "pqc"
          // when absent, preserving the original migrate-to-PQC behaviour.
          return {
            operation: 'Invoke',
            payload: { thingName: ctx.args.thingName, variant: ctx.args.variant }
          };
        }
        export function response(ctx) {
          return ctx.result;
        }
    DependsOn: DeviceApiSchema

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Telemetry Processor (IoT Rule → DynamoDB → AppSync)
  # ═══════════════════════════════════════════════════════════════════════════

  TelemetryProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAndAppSync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DeviceTable.Arn
              - Effect: Allow
                Action:
                  - appsync:GraphQL
                Resource:
                  - !Sub '${DeviceApi.Arn}/*'

  TelemetryProcessorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "synchronous IoT-rule/AppSync invocations, no async DLQ needed"
          - id: CKV_AWS_117
            comment: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
          - id: CKV_AWS_173
            comment: "env vars encrypted with AWS-managed key by default"
    Properties:
      FunctionName: pqc-workshop-telemetry-processor
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      ReservedConcurrentExecutions: 10
      Role: !GetAtt TelemetryProcessorRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref DeviceTable
          APPSYNC_ENDPOINT: !GetAtt DeviceApi.GraphQLUrl
      # Packaged from dashboard/lambda/telemetry-processor (uses UpdateItem, which
      # preserves fields like migrationStatus that other writers set).
      Code: ../lambda/telemetry-processor

  TelemetryProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TelemetryProcessorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Command Publisher (Dashboard → IoT Core MQTT)
  # ═══════════════════════════════════════════════════════════════════════════

  CommandPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IoTPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource:
                  - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/*/ota'

  CommandPublisherFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "synchronous IoT-rule/AppSync invocations, no async DLQ needed"
          - id: CKV_AWS_117
            comment: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
          - id: CKV_AWS_173
            comment: "env vars encrypted with AWS-managed key by default"
    Properties:
      FunctionName: pqc-workshop-command-publisher
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      ReservedConcurrentExecutions: 5
      Role: !GetAtt CommandPublisherRole.Arn
      Environment:
        Variables:
          IOT_ENDPOINT: !Sub '${AWS::AccountId}-ats.iot.${AWS::Region}.amazonaws.com'
      Code: ../lambda/command-publisher

  # ═══════════════════════════════════════════════════════════════════════════
  # IoT Rules — Route Telemetry and Lifecycle to Lambda
  # ═══════════════════════════════════════════════════════════════════════════

  IoTRuleRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TelemetryProcessorFunction.Arn

  TelemetryIoTRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: pqc_workshop_telemetry
      TopicRulePayload:
        Description: Routes all device telemetry to the dashboard Lambda
        Sql: "SELECT * FROM 'dt/+/telemetry'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt TelemetryProcessorFunction.Arn

  LifecycleIoTRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: pqc_workshop_lifecycle
      TopicRulePayload:
        Description: Routes all device lifecycle events to the dashboard Lambda
        Sql: "SELECT * FROM 'dt/+/lifecycle'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt TelemetryProcessorFunction.Arn

  # ═══════════════════════════════════════════════════════════════════════════
  # Message Log — Captures all MQTT messages for dashboard log view
  # ═══════════════════════════════════════════════════════════════════════════

  MessageLogTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "workshop depends on fixed resource names referenced across stacks/scripts"
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: "encrypted with the AWS-owned/managed DynamoDB key (SSEEnabled); a customer-managed CMK is out of scope for the workshop sample"
    Properties:
      TableName: pqc-workshop-message-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: thingName
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: thingName
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  MessageLoggerRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBWriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt MessageLogTable.Arn

  MessageLoggerFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "synchronous IoT-rule/AppSync invocations, no async DLQ needed"
          - id: CKV_AWS_117
            comment: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
          - id: CKV_AWS_173
            comment: "env vars encrypted with AWS-managed key by default"
    Properties:
      FunctionName: pqc-workshop-message-logger
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      ReservedConcurrentExecutions: 10
      Role: !GetAtt MessageLoggerRole.Arn
      Environment:
        Variables:
          LOG_TABLE_NAME: !Ref MessageLogTable
      Code: ../lambda/message-logger

  MessageLoggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MessageLoggerFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/*'

  MessageLogDtRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: pqc_workshop_message_log_dt
      TopicRulePayload:
        Description: Captures all device-to-cloud messages for dashboard log
        Sql: "SELECT *, topic() as mqtttopic FROM 'dt/+/+'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt MessageLoggerFunction.Arn

  MessageLogCmdRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: pqc_workshop_message_log_cmd
      TopicRulePayload:
        Description: Captures all cloud-to-device commands for dashboard log
        Sql: "SELECT *, topic() as mqtttopic FROM 'cmd/+/+'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - Lambda:
              FunctionArn: !GetAtt MessageLoggerFunction.Arn

  # ─── AppSync Data Source: Message Log DynamoDB ─────────────────────────────

  MessageLogDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      Name: MessageLogSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncMessageLogRole.Arn
      DynamoDBConfig:
        AwsRegion: !Ref AWS::Region
        TableName: !Ref MessageLogTable

  AppSyncMessageLogRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBQueryAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt MessageLogTable.Arn

  GetDeviceLogResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      TypeName: Query
      FieldName: getDeviceLog
      DataSourceName: !GetAtt MessageLogDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          const limit = ctx.args.limit || 50;
          return {
            operation: 'Query',
            query: {
              expression: 'thingName = :tn',
              expressionValues: util.dynamodb.toMapValues({ ':tn': ctx.args.thingName })
            },
            scanIndexForward: false,
            limit: limit
          };
        }
        export function response(ctx) {
          return ctx.result.items;
        }
    DependsOn: DeviceApiSchema

  # ═══════════════════════════════════════════════════════════════════════════
  # Broker Log Reader — Queries CloudWatch Logs for Mosquitto broker activity
  # ═══════════════════════════════════════════════════════════════════════════

  BrokerLogReaderRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchLogsRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:GetQueryResults
                Resource:
                  # Must match the LIVE broker log group the Lambda queries
                  # (LOG_GROUP_NAME below = /pqc-workshop/broker-container, the
                  # ECS Fargate broker). The retired Pi group
                  # /pqc-workshop/mosquitto-broker is no longer used; granting it
                  # here left StartQuery denied on the real group.
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/pqc-workshop/broker-container:*'

  BrokerLogReaderFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "synchronous IoT-rule/AppSync invocations, no async DLQ needed"
          - id: CKV_AWS_117
            comment: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
          - id: CKV_AWS_173
            comment: "env vars encrypted with AWS-managed key by default"
    Properties:
      FunctionName: pqc-workshop-broker-log-reader
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      ReservedConcurrentExecutions: 5
      Role: !GetAtt BrokerLogReaderRole.Arn
      Environment:
        Variables:
          # The LIVE broker is the ECS Fargate container; the legacy Raspberry-Pi
          # group /pqc-workshop/mosquitto-broker is retired. Reading the wrong
          # group is what made it impossible to tell which broker a device used.
          LOG_GROUP_NAME: /pqc-workshop/broker-container
      Code: ../lambda/broker-log-reader

  AppSyncBrokerLogRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt BrokerLogReaderFunction.Arn

  BrokerLogDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      Name: BrokerLogSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncBrokerLogRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt BrokerLogReaderFunction.Arn

  GetBrokerLogResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt DeviceApi.ApiId
      TypeName: Query
      FieldName: getBrokerLog
      DataSourceName: !GetAtt BrokerLogDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          return {
            operation: 'Invoke',
            payload: {
              thingName: ctx.args.thingName || '',
              limit: ctx.args.limit || 50
            }
          };
        }
        export function response(ctx) {
          return ctx.result;
        }
    DependsOn: DeviceApiSchema

  # ═══════════════════════════════════════════════════════════════════════════
  # S3 + CloudFront — Dashboard Hosting
  # ═══════════════════════════════════════════════════════════════════════════

  # Hosts the v2 "PQC Firmware Manager" dashboard (Vite/React app in
  # raw_device_builder/dashboard-v2/frontend). The deploy tooling builds the app
  # and syncs dist/ to this bucket, then invalidates the distribution. The v1
  # "Device Dashboard" frontend/hosting has been removed (superseded by v2).
  FirmwareDashboardBucket:
    Type: AWS::S3::Bucket
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "workshop sample; access logging adds a log bucket out of scope"
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "workshop sample; access logging adds a log bucket out of scope"
    Properties:
      # No explicit BucketName: let CloudFormation auto-generate a unique name.
      # A fixed name (pqc-workshop-firmware-dashboard-<acct>) tripped early
      # validation's resource-name-conflict check whenever a bucket of that name
      # already existed (a leftover empty bucket from a prior/failed deploy),
      # blocking the whole master stack. Consumers read the real name from the
      # DashboardBucketName stack output (deploy-workshop.sh does), so nothing
      # depends on the literal name.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FirmwareDashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FirmwareDashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FirmwareDashboardBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FirmwareDashboardDistribution}'

  FirmwareDashboardOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pqc-workshop-firmware-dashboard-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FirmwareDashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W70
            reason: "default CloudFront cert"
          - id: W10
            reason: "workshop sample dashboard; WAF/access-logging out of scope"
      checkov:
        skip:
          - id: CKV_AWS_174
            comment: "default CloudFront cert"
          - id: CKV_AWS_86
            comment: "workshop sample dashboard; WAF/access-logging out of scope"
          - id: CKV_AWS_68
            comment: "workshop sample dashboard; WAF/access-logging out of scope"
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: PQC Workshop Firmware Manager Dashboard
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FirmwareDashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FirmwareDashboardOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ═══════════════════════════════════════════════════════════════════════════
  # CodeBuild — Build + deploy the v2 dashboard (moved off the deploy host)
  # ═══════════════════════════════════════════════════════════════════════════
  # The Vite/React frontend was previously built with npm on the operator's
  # laptop and synced to the site bucket by deploy-workshop.sh. That made the
  # deploy laptop-dependent and slow. This CodeBuild project runs the build in
  # AWS: it reads the runtime config from SSM (/pqc-workshop/dashboard/*, written
  # by the deploy script), materializes public/config.json, `npm run build`s,
  # syncs the artifact to the site bucket, and invalidates CloudFront. The build
  # is env-agnostic (config.json is fetched at runtime, not baked in), so the
  # project can be re-run standalone from the console to redeploy the dashboard.

  DashboardSourceBucket:
    Type: AWS::S3::Bucket
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "workshop sample; access logging adds a log bucket out of scope"
          - id: W51
            reason: "CodeBuild source bucket; private (public-access-block enabled), accessed only by the dashboard build role — no bucket policy needed"
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "workshop sample; access logging adds a log bucket out of scope"
    Properties:
      BucketName: !Sub 'pqc-workshop-dashboard-source-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  DashboardBuildRole:
    Type: AWS::IAM::Role
    Properties:
      # No explicit RoleName (auto-generated); referenced only by !GetAtt .Arn.
      # Fixed role names collide on repeated deploys in a shared account (early
      # validation resource-name-conflict).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DashboardBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CodeBuild log stream
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/pqc-workshop-dashboard-build*'
              # Read the build source (Vite frontend) from the source bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt DashboardSourceBucket.Arn
                  - !Sub '${DashboardSourceBucket.Arn}/*'
              # Write the built site to the CloudFront origin bucket (--delete
              # needs List + Delete alongside Put/Get).
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt FirmwareDashboardBucket.Arn
                  - !Sub '${FirmwareDashboardBucket.Arn}/*'
              # Invalidate the CloudFront distribution after sync
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FirmwareDashboardDistribution}'
              # Read the deployment-derived dashboard config from SSM
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pqc-workshop/dashboard/*'

  DashboardBuildProject:
    Type: AWS::CodeBuild::Project
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: "default AWS-managed CodeBuild encryption key; a customer-managed CMK is out of scope for the workshop sample"
    Properties:
      Name: pqc-workshop-dashboard-build
      Description: Builds + deploys the v2 PQC dashboard (Vite/React) to S3 + CloudFront
      ServiceRole: !GetAtt DashboardBuildRole.Arn
      TimeoutInMinutes: 20
      Source:
        Type: S3
        Location: !Sub '${DashboardSourceBucket}/frontend/'
        # The Vite frontend ships a buildspec.yml at its root.
        BuildSpec: buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        # No Docker needed — this is a plain npm build (unlike the broker image
        # build, which needs PrivilegedMode for `docker build`).
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          # The CloudFront origin bucket to sync the built site into.
          - Name: DASHBOARD_BUCKET
            Value: !Ref FirmwareDashboardBucket
          # The distribution to invalidate after sync.
          - Name: DASHBOARD_DISTRIBUTION_ID
            Value: !Ref FirmwareDashboardDistribution
          # SSM path prefix holding the runtime dashboard config.
          - Name: SSM_PREFIX
            Value: /pqc-workshop/dashboard
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub '/aws/codebuild/pqc-workshop-dashboard-build'

  # ─── Build Trigger Lambda (in-stack, gated) ────────────────────────────────
  # Optional: build the dashboard during stack create/update when
  # DashboardTriggerBuild=true. Default 'false' for the orchestrated deploy
  # (deploy-workshop.sh stages source + triggers post-deploy), matching the
  # broker image build pattern.

  DashboardBuildTriggerRole:
    Type: AWS::IAM::Role
    Condition: ShouldTriggerDashboardBuild
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TriggerBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt DashboardBuildProject.Arn

  DashboardBuildTriggerFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldTriggerDashboardBuild
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: "synchronous IoT-rule/AppSync invocations, no async DLQ needed"
          - id: CKV_AWS_117
            comment: "calls public AWS APIs (IoT/DynamoDB/AppSync), no VPC resources"
          - id: CKV_AWS_173
            comment: "env vars encrypted with AWS-managed key by default"
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      ReservedConcurrentExecutions: 5
      Role: !GetAtt DashboardBuildTriggerRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref DashboardBuildProject
      Code:
        ZipFile: |
          """
          Triggers the dashboard CodeBuild project and waits for completion.
          Used as a CloudFormation Custom Resource to build + deploy the v2
          dashboard during stack deployment (only when DashboardTriggerBuild=true).
          """
          import boto3
          import time
          import os
          import cfnresponse

          codebuild = boto3.client('codebuild')

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  project = os.environ['PROJECT_NAME']
                  print(f"Starting build for project: {project}")

                  resp = codebuild.start_build(projectName=project)
                  build_id = resp['build']['id']
                  print(f"Build started: {build_id}")

                  # Poll for completion (max ~14 minutes to stay within Lambda timeout)
                  for _ in range(170):
                      time.sleep(5)
                      builds = codebuild.batch_get_builds(ids=[build_id])
                      status = builds['builds'][0]['buildStatus']
                      phase = builds['builds'][0].get('currentPhase', 'UNKNOWN')
                      print(f"  Status: {status}, Phase: {phase}")

                      if status == 'SUCCEEDED':
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                              'BuildId': build_id,
                              'Status': 'SUCCEEDED'
                          })
                          return
                      elif status in ('FAILED', 'FAULT', 'TIMED_OUT', 'STOPPED'):
                          cfnresponse.send(event, context, cfnresponse.FAILED, {
                              'Error': f'Build {status}: {build_id}'
                          })
                          return

                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': f'Build timed out (Lambda timeout): {build_id}'
                  })
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  TriggerDashboardBuild:
    Type: Custom::TriggerDashboardBuild
    Condition: ShouldTriggerDashboardBuild
    DependsOn:
      - DashboardBuildProject
      - FirmwareDashboardBucketPolicy
    Properties:
      ServiceToken: !GetAtt DashboardBuildTriggerFunction.Arn
      # Change this value to force a rebuild on stack update.
      BuildVersion: '1'

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  DashboardURL:
    Description: v2 Firmware Manager dashboard URL (CloudFront)
    Value: !Sub 'https://${FirmwareDashboardDistribution.DomainName}'

  DashboardBuildProjectName:
    Description: CodeBuild project that builds + deploys the v2 dashboard
    Value: !Ref DashboardBuildProject

  DashboardSourceBucketName:
    Description: S3 bucket the deploy script stages the dashboard build source into
    Value: !Ref DashboardSourceBucket

  DashboardBucketName:
    Description: S3 bucket for the v2 dashboard static files
    Value: !Ref FirmwareDashboardBucket

  DashboardDistributionId:
    Description: CloudFront distribution ID (for cache invalidation after sync)
    Value: !Ref FirmwareDashboardDistribution

  AppSyncEndpoint:
    Description: AppSync GraphQL endpoint
    Value: !GetAtt DeviceApi.GraphQLUrl

  AppSyncApiId:
    Description: AppSync API ID
    Value: !GetAtt DeviceApi.ApiId

  CognitoIdentityPoolId:
    Description: Cognito Identity Pool ID for unauthenticated dashboard access
    Value: !Ref CognitoIdentityPool

  DeviceTableName:
    Description: DynamoDB table storing device state
    Value: !Ref DeviceTable

  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
