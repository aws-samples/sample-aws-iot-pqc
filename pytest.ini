[pytest]
# Fast, mocked unit-test suite for the workshop's Python components.
# Integration tests (real AWS) are marked @pytest.mark.integration and are
# DESELECTED by default via the addopts below — run them explicitly with
#   pytest -m integration
markers =
    integration: end-to-end tests that call real AWS services (slow; opt-in)

# importmode=importlib lets same-named test files (test_index.py) live in sibling
# Lambda dirs without collection collisions and without needing __init__.py.
addopts = -m "not integration" -ra --import-mode=importlib
testpaths =
    dashboard/lambda
    raw_device_builder/lambda
    raw_device_builder/builder-pi
    cloudformation/statemachine
python_files = test_*.py
python_classes = Test*
python_functions = test_*
