---
# ─────────────────────────────────────────────────────────────────────────────
# Greengrass Component Recipe: PQC Mosquitto Broker
#
# This component manages the lifecycle of the PQC-enabled Mosquitto MQTT
# broker on the Greengrass core device (Raspberry Pi).
#
# The component:
#   - Installs/configures Mosquitto with PQC TLS support
#   - Starts the broker as a long-running process
#   - Monitors health and restarts on failure
#   - Bridges ESP32 device messages to AWS IoT Core
#
# Copyright 2024-2026 Amazon.com, Inc. or its affiliates. All Rights Reserved.
# SPDX-License-Identifier: MIT-0
# ─────────────────────────────────────────────────────────────────────────────
RecipeFormatVersion: "2020-01-25"

ComponentName: com.workshop.pqc-mosquitto
ComponentVersion: "1.0.0"
ComponentDescription: >
  PQC-enabled Mosquitto MQTT broker for the ESP32 post-quantum cryptography
  workshop. Accepts TLS 1.3 connections from ESP32 devices using hybrid
  ML-KEM key exchange and bridges messages to AWS IoT Core.
ComponentPublisher: AWS PQC Workshop
ComponentType: aws.greengrass.generic

ComponentConfiguration:
  DefaultConfiguration:
    # Mosquitto installation path
    mosquittoPrefix: "/opt/mosquitto-pqc"
    # OpenSSL installation path
    opensslPrefix: "/opt/openssl-pqc"
    # Port for PQC TLS listener
    mqttPort: 8883
    # AWS IoT Core endpoint (override in deployment)
    iotCoreEndpoint: "REPLACE_WITH_IOT_ENDPOINT"
    # Greengrass Thing name (for bridge client ID)
    greengrassThingName: "REPLACE_WITH_GREENGRASS_THING_NAME"

Manifests:
  - Platform:
      os: linux
      architecture: aarch64
    Lifecycle:
      install:
        RequiresPrivilege: true
        Script: |
          #!/bin/bash
          set -e
          echo "[PQC-Mosquitto] Running install lifecycle..."

          MOSQUITTO_PREFIX="{configuration:/mosquittoPrefix}"

          # Verify Mosquitto is installed
          if [[ ! -x "$MOSQUITTO_PREFIX/sbin/mosquitto" ]]; then
            echo "[PQC-Mosquitto] ERROR: Mosquitto not found at $MOSQUITTO_PREFIX"
            echo "[PQC-Mosquitto] Run setup-mosquitto-pqc.sh first"
            exit 1
          fi

          # Verify certificates exist
          CERT_DIR="$MOSQUITTO_PREFIX/etc/mosquitto/certs"
          for cert in ca.crt broker.crt broker.key; do
            if [[ ! -f "$CERT_DIR/$cert" ]]; then
              echo "[PQC-Mosquitto] ERROR: Missing certificate: $CERT_DIR/$cert"
              echo "[PQC-Mosquitto] Run generate-broker-certs.sh and copy certs"
              exit 1
            fi
          done

          # Update bridge config with IoT Core endpoint
          BRIDGE_CONF="$MOSQUITTO_PREFIX/etc/mosquitto/conf.d/bridge-iotcore.conf"
          if [[ -f "$BRIDGE_CONF" ]]; then
            sed -i "s|REPLACE_WITH_IOT_ENDPOINT|{configuration:/iotCoreEndpoint}|g" "$BRIDGE_CONF"
            sed -i "s|REPLACE_WITH_GREENGRASS_THING_NAME|{configuration:/greengrassThingName}|g" "$BRIDGE_CONF"
          fi

          # Update ACL with bridge username (cert CN = Greengrass thing name)
          ACL_CONF="$MOSQUITTO_PREFIX/etc/mosquitto/acl.conf"
          if [[ -f "$ACL_CONF" ]]; then
            sed -i "s|REPLACE_WITH_GREENGRASS_THING_NAME|{configuration:/greengrassThingName}|g" "$ACL_CONF"
          fi

          echo "[PQC-Mosquitto] Install complete"

      run:
        RequiresPrivilege: true
        Script: |
          #!/bin/bash
          set -e
          echo "[PQC-Mosquitto] Starting PQC Mosquitto broker..."

          MOSQUITTO_PREFIX="{configuration:/mosquittoPrefix}"
          OPENSSL_PREFIX="{configuration:/opensslPrefix}"

          # Set library path for PQC OpenSSL
          export LD_LIBRARY_PATH="$OPENSSL_PREFIX/lib64:${LD_LIBRARY_PATH:-}"

          # Start Mosquitto in foreground (Greengrass manages the process)
          exec "$MOSQUITTO_PREFIX/sbin/mosquitto" \
            -c "$MOSQUITTO_PREFIX/etc/mosquitto/mosquitto-pqc.conf" \
            -v

      shutdown:
        RequiresPrivilege: true
        Script: |
          #!/bin/bash
          echo "[PQC-Mosquitto] Stopping PQC Mosquitto broker..."
          # Greengrass sends SIGTERM to the run process automatically
          # This script runs after the process exits
          echo "[PQC-Mosquitto] Broker stopped"

    Artifacts: []

ComponentDependencies: {}
