# ─────────────────────────────────────────────────────────────────────────────
# acl.conf
#
# Mosquitto Access Control List for ESP32 PQC workshop devices.
#
# Since devices use MAC-derived client IDs (e.g., "esp32-AABBCC") and a
# shared fleet certificate, we use %c (client ID) for pattern matching.
#
# Pattern substitution:
#   %u = username (CN from client cert — shared fleet cert in this setup)
#   %c = client ID (MAC-derived Thing name, unique per device)
#
# Copyright 2024-2026 Amazon.com, Inc. or its affiliates. All Rights Reserved.
# SPDX-License-Identifier: MIT-0
# ─────────────────────────────────────────────────────────────────────────────

# ─── Per-Device Permissions (matched by client ID = MAC-derived name) ────────

# Each device can publish to its own telemetry and lifecycle topics
pattern readwrite dt/%c/telemetry
pattern readwrite dt/%c/lifecycle

# Each device can subscribe to its own command topics
pattern readwrite cmd/%c/#

# ─── Bridge User (for IoT Core bridge) ──────────────────────────────────────
# The bridge connection uses the Greengrass device identity.
# Allow it to read/write all device topics for forwarding.
user REPLACE_WITH_GREENGRASS_THING_NAME
topic readwrite dt/#
topic readwrite cmd/#
topic readwrite $SYS/broker/bridge/#
