# ─────────────────────────────────────────────────────────────────────────────
# bridge-iotcore.conf
#
# Mosquitto bridge configuration to forward messages between the local
# PQC broker and AWS IoT Core using classical TLS 1.2.
#
# Place this file in /opt/mosquitto-pqc/etc/mosquitto/conf.d/
#
# The bridge connects to IoT Core as the Greengrass core device,
# forwarding ESP32 telemetry upstream and commands downstream.
#
# Copyright 2024-2026 Amazon.com, Inc. or its affiliates. All Rights Reserved.
# SPDX-License-Identifier: MIT-0
# ─────────────────────────────────────────────────────────────────────────────

# ─── Bridge Connection to AWS IoT Core ───────────────────────────────────────
connection aws-iot-core

# AWS IoT Core endpoint (replace with your account endpoint)
# Find yours: aws iot describe-endpoint --endpoint-type iot:Data-ATS
address REPLACE_WITH_IOT_ENDPOINT:8883

# Bridge protocol version
bridge_protocol_version mqttv311

# ─── Authentication ──────────────────────────────────────────────────────────
# Use the Greengrass core device certificate for IoT Core auth
bridge_cafile /opt/mosquitto-pqc/etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /opt/mosquitto-pqc/etc/mosquitto/certs/greengrass-device.crt
bridge_keyfile /opt/mosquitto-pqc/etc/mosquitto/certs/greengrass-device.key

# TLS version for the IoT Core connection (classical)
bridge_tls_version tlsv1.2

# ─── Topic Bridging ─────────────────────────────────────────────────────────
# Syntax: topic <pattern> <direction> <qos> <local-prefix> <remote-prefix>
#
# direction:
#   out = local → remote (ESP32 telemetry → IoT Core)
#   in  = remote → local (IoT Core commands → ESP32)
#   both = bidirectional

# Forward all device telemetry to IoT Core
topic dt/+/telemetry out 0

# Forward all lifecycle events to IoT Core
topic dt/+/lifecycle out 1

# Forward commands from IoT Core to local devices
topic cmd/+/+ in 1

# ─── Connection Settings ─────────────────────────────────────────────────────
# Clean session (false = persistent session, broker remembers subscriptions)
cleansession false

# Keepalive interval (seconds)
keepalive_interval 60

# Retry interval for failed connections (seconds)
restart_timeout 10 30

# Notification topic (bridge status)
notifications true
notification_topic $SYS/broker/bridge/aws-iot-core/state

# Use the Greengrass Thing name as the bridge client ID
# This must match the IoT policy attached to the Greengrass certificate
remote_clientid REPLACE_WITH_GREENGRASS_THING_NAME

# Start the bridge automatically
start_type automatic
