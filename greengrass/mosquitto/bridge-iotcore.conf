# ─────────────────────────────────────────────────────────────────────────────
# bridge-iotcore.conf
#
# Mosquitto bridge to AWS IoT Core.
# Place in /opt/mosquitto-pqc/etc/mosquitto/conf.d/
#
# Before deploying, replace the placeholders:
#   REPLACE_WITH_IOT_ENDPOINT → your IoT data endpoint
#   REPLACE_WITH_GREENGRASS_THING_NAME → your Greengrass Thing name
#
# Copyright 2024-2026 Amazon.com, Inc. or its affiliates. All Rights Reserved.
# SPDX-License-Identifier: MIT-0
# ─────────────────────────────────────────────────────────────────────────────

connection aws-iot-core
address REPLACE_WITH_IOT_ENDPOINT:8883

# TLS authentication to IoT Core
bridge_cafile /opt/mosquitto-pqc/etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /opt/mosquitto-pqc/etc/mosquitto/certs/greengrass-device.crt
bridge_keyfile /opt/mosquitto-pqc/etc/mosquitto/certs/greengrass-device.key

# Client ID must match the IoT policy
clientid REPLACE_WITH_GREENGRASS_THING_NAME

# Connection settings
cleansession true
try_private false
notifications false

# Topic bridging
# ESP32 telemetry → IoT Core
topic dt/+/telemetry out 0
# ESP32 lifecycle → IoT Core
topic dt/+/lifecycle out 1
# Commands from IoT Core → ESP32 devices
topic cmd/+/+ in 1
