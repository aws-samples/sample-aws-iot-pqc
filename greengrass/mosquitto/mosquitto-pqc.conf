# ─────────────────────────────────────────────────────────────────────────────
# mosquitto-pqc.conf
#
# Mosquitto MQTT broker configuration with Post-Quantum Cryptography (PQC)
# support via OpenSSL 3.5+ and TLS 1.3 hybrid ML-KEM key exchange.
#
# This broker accepts connections from ESP32 devices using TLS 1.3 with
# hybrid PQC key exchange (SecP256r1MLKEM768) and bridges messages to
# AWS IoT Core using classical TLS.
#
# Copyright 2024-2026 Amazon.com, Inc. or its affiliates. All Rights Reserved.
# SPDX-License-Identifier: MIT-0
# ─────────────────────────────────────────────────────────────────────────────

# ─── Global Settings ─────────────────────────────────────────────────────────
per_listener_settings true
persistence true
persistence_location /opt/mosquitto-pqc/var/lib/mosquitto/
log_dest file /opt/mosquitto-pqc/var/log/mosquitto/mosquitto.log
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ─── PQC TLS Listener (ESP32 devices connect here) ──────────────────────────
listener 8883
protocol mqtt

# TLS configuration
cafile /opt/mosquitto-pqc/etc/mosquitto/certs/ca.crt
certfile /opt/mosquitto-pqc/etc/mosquitto/certs/broker.crt
keyfile /opt/mosquitto-pqc/etc/mosquitto/certs/broker.key

# Require client certificates (mutual TLS)
require_certificate true

# Use the client ID for ACL matching (not the cert CN, since we use a fleet cert)
use_identity_as_username false
use_username_as_clientid false

# TLS version — allow both 1.2 (classical firmware) and 1.3 (PQC firmware)
# The classical firmware uses mbedTLS with TLS 1.2, the PQC firmware uses
# wolfSSL with TLS 1.3 + ML-KEM hybrid key exchange.
# OpenSSL 3.5 supports both versions simultaneously.
# tls_version tlsv1.2
# (omitting tls_version allows both 1.2 and 1.3)

# Cipher suites for TLS 1.3
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256

# Cipher suites for TLS 1.2 (classical firmware fallback)
ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384

# OpenSSL 3.5 named groups — this is where PQC is configured
# SecP256r1MLKEM768 = hybrid ECDHE P-256 + ML-KEM-768 (IANA code point 4587)
# Also allow classical fallback for the v1 firmware
openssl_groups SecP256r1MLKEM768:X25519MLKEM768:secp256r1:secp384r1:x25519

# Access control
acl_file /opt/mosquitto-pqc/etc/mosquitto/acl.conf

# ─── Include bridge configuration ───────────────────────────────────────────
include_dir /opt/mosquitto-pqc/etc/mosquitto/conf.d
