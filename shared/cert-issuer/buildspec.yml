version: 0.2

# ─────────────────────────────────────────────────────────────────────────────
# Default buildspec for the cert-issuer IMAGE build
# (pqc-workshop-cert-issuer-image-build). Builds the shared cert-issuer
# Dockerfile (OpenSSL 3.5 + issue_cert.py) and pushes it to the
# pqc-workshop-cert-issuer ECR repo.
#
# This mirrors broker-container/docker/buildspec.yml (the broker image build):
# the CodeBuild project sets no explicit BuildSpec, so it uses this default
# buildspec.yml at the source root. The SEPARATE broker-cert PROVISIONER project
# runs the same source with an explicit BuildSpec (buildspec-broker-certs.yml),
# so the two never collide.
#
# Env vars supplied by the CodeBuild project (broker-container-stack.yaml):
#   ACCOUNT_ID          — AWS account id
#   AWS_DEFAULT_REGION  — build region
#   ECR_REPO_NAME       — target ECR repo (pqc-workshop-cert-issuer)
# ─────────────────────────────────────────────────────────────────────────────
phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - BUILD_TAG=$(date +%Y%m%d-%H%M%S)
      - echo "ECR_URI=$ECR_URI"
      - echo "BUILD_TAG=$BUILD_TAG"

  build:
    commands:
      - echo "Building shared cert-issuer image (OpenSSL 3.5 + ML-DSA-44)..."
      # --no-cache so the Dockerfile's ML-DSA-44 self-test always re-runs.
      - docker build --no-cache -t $ECR_URI:latest -t $ECR_URI:$BUILD_TAG .

  post_build:
    commands:
      - echo "Pushing to ECR..."
      - docker push $ECR_URI:latest
      - docker push $ECR_URI:$BUILD_TAG
      - echo "Cert-issuer image pushed successfully"
      - echo "{\"imageUri\":\"$ECR_URI:latest\",\"buildTag\":\"$BUILD_TAG\"}" > build-output.json

artifacts:
  files:
    - build-output.json
  discard-paths: yes
