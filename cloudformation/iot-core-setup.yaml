AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS IoT Core infrastructure for the ESP32 PQC (Post-Quantum Cryptography)
  sample project. Creates an IoT Thing, certificate, policy, and IoT Rules
  for telemetry and lifecycle event routing.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  ThingName:
    Type: String
    Default: my-esp32-pqc-thing
    Description: >
      Name of the IoT Thing. Must match THINGNAME in the device's secrets.h.
    AllowedPattern: '[a-zA-Z0-9_-]+'
    ConstraintDescription: >
      Thing name must contain only alphanumeric characters, hyphens, and underscores.

  ThingTypeName:
    Type: String
    Default: esp32-pqc-device
    Description: Thing Type for grouping PQC-capable ESP32 devices.

  EnableTelemetryRule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to create an IoT Rule that routes telemetry messages to CloudWatch Logs.

  EnableLifecycleRule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to create an IoT Rule that routes lifecycle events to CloudWatch Logs.

  TelemetryLogGroupRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch Logs retention period for telemetry messages.

Conditions:
  CreateTelemetryRule: !Equals [!Ref EnableTelemetryRule, 'true']
  CreateLifecycleRule: !Equals [!Ref EnableLifecycleRule, 'true']

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ─── Thing Type ──────────────────────────────────────────────────────────
  IoTThingType:
    Type: AWS::IoT::ThingType
    Properties:
      ThingTypeName: !Ref ThingTypeName
      ThingTypeProperties:
        ThingTypeDescription: 'ESP32 devices using post-quantum cryptography (PQC) with wolfSSL TLS 1.3 and hybrid Kyber/ML-KEM key exchange.'
        SearchableAttributes:
          - firmware_version
          - pqc_algorithm

  # ─── Thing ──────────────────────────────────────────────────────────────
  IoTThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref ThingName
      AttributePayload:
        Attributes:
          firmware_version: '1.0.0'
          pqc_algorithm: P521_KYBER_LEVEL5
          chip_family: ESP32
    DependsOn: IoTThingType

  # ─── Associate Thing with Thing Type (Custom Resource) ──────────────────
  # AWS::IoT::Thing does not support ThingTypeName natively in CloudFormation.
  # This custom resource uses a Lambda to call UpdateThing after creation.
  ThingTypeAssociationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ThingName}-thing-type-assoc-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IoTUpdateThing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:UpdateThing
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:thing/${ThingName}'

  ThingTypeAssociationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ThingName}-thing-type-assoc'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt ThingTypeAssociationRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def handler(event, context):
              try:
                  iot = boto3.client('iot')
                  thing_name = event['ResourceProperties']['ThingName']
                  thing_type = event['ResourceProperties']['ThingTypeName']
                  if event['RequestType'] in ['Create', 'Update']:
                      iot.update_thing(thingName=thing_name, thingTypeName=thing_type)
                  elif event['RequestType'] == 'Delete':
                      # Remove thing type association on stack deletion
                      iot.update_thing(thingName=thing_name, removeThingType=True)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  ThingTypeAssociation:
    Type: Custom::ThingTypeAssociation
    Properties:
      ServiceToken: !GetAtt ThingTypeAssociationFunction.Arn
      ThingName: !Ref ThingName
      ThingTypeName: !Ref ThingTypeName
    DependsOn:
      - IoTThing
      - IoTThingType

  # ─── IoT Policy ─────────────────────────────────────────────────────────
  # Grants the device permission to connect, publish telemetry/lifecycle,
  # and subscribe to command topics. Follows least-privilege principle.
  IoTPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${ThingName}-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow MQTT connect with the Thing name as client ID
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${ThingName}'

          # Allow publishing telemetry and lifecycle events
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/dt/${ThingName}/telemetry'
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/dt/${ThingName}/lifecycle'

          # Allow subscribing to command topics (wildcard)
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/cmd/${ThingName}/+'

          # Allow receiving messages on command topics
          - Effect: Allow
            Action: iot:Receive
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/${ThingName}/*'

          # Allow retained messages (for lifecycle LWT)
          - Effect: Allow
            Action: iot:RetainPublish
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/dt/${ThingName}/lifecycle'

  # ─── Certificate (Custom Resource) ───────────────────────────────────────
  # AWS::IoT::Certificate with CertificateMode=DEFAULT cannot auto-generate
  # key pairs in CloudFormation. This Custom Resource calls the IoT
  # create-keys-and-certificate API and stores the private key in
  # Secrets Manager so you can retrieve it after deployment.
  CertificateProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ThingName}-cert-provisioner-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IoTCertAndSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateKeysAndCertificate
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:DetachThingPrincipal
                  - iot:DetachPolicy
                  - iot:ListTargetsForPolicy
                  - iot:ListThingPrincipals
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:iot/${ThingName}/*'
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/iot/${ThingName}/*'

  CertificateProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ThingName}-cert-provisioner'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt CertificateProvisionerRole.Arn
      Environment:
        Variables:
          THING_NAME: !Ref ThingName
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os
          import json
          import urllib.request

          AMAZON_ROOT_CA_URL = 'https://www.amazontrust.com/repository/AmazonRootCA1.pem'

          def handler(event, context):
              iot = boto3.client('iot')
              sm = boto3.client('secretsmanager')
              ssm = boto3.client('ssm')
              thing_name = os.environ['THING_NAME']

              param_root_ca = f'/iot/{thing_name}/root-ca-pem'
              param_cert = f'/iot/{thing_name}/certificate-pem'

              try:
                  if event['RequestType'] == 'Create':
                      # Create certificate and keys
                      resp = iot.create_keys_and_certificate(setAsActive=True)
                      cert_arn = resp['certificateArn']
                      cert_id = resp['certificateId']
                      cert_pem = resp['certificatePem']
                      key_pem = resp['keyPair']['PrivateKey']

                      # Download Amazon Root CA 1
                      root_ca_pem = urllib.request.urlopen(AMAZON_ROOT_CA_URL).read().decode('utf-8')

                      # Store private key in Secrets Manager (sensitive)
                      secret_value = json.dumps({
                          'certificatePem': cert_pem,
                          'privateKey': key_pem,
                          'certificateArn': cert_arn,
                          'certificateId': cert_id
                      })
                      sm.create_secret(
                          Name=f'iot/{thing_name}/device-credentials',
                          Description=f'IoT device certificate and private key for {thing_name}',
                          SecretString=secret_value,
                          Tags=[
                              {'Key': 'Thing', 'Value': thing_name},
                              {'Key': 'ManagedBy', 'Value': 'CloudFormation'}
                          ]
                      )

                      # Store Root CA in SSM Parameter Store (not sensitive)
                      ssm.put_parameter(
                          Name=param_root_ca,
                          Description=f'Amazon Root CA 1 PEM for {thing_name}',
                          Value=root_ca_pem,
                          Type='String',
                          Tags=[
                              {'Key': 'Thing', 'Value': thing_name},
                              {'Key': 'ManagedBy', 'Value': 'CloudFormation'}
                          ]
                      )

                      # Store device certificate PEM in SSM Parameter Store (not sensitive)
                      ssm.put_parameter(
                          Name=param_cert,
                          Description=f'IoT device certificate PEM for {thing_name}',
                          Value=cert_pem,
                          Type='String',
                          Tags=[
                              {'Key': 'Thing', 'Value': thing_name},
                              {'Key': 'ManagedBy', 'Value': 'CloudFormation'}
                          ]
                      )

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'CertificateArn': cert_arn,
                          'CertificateId': cert_id,
                          'SecretName': f'iot/{thing_name}/device-credentials',
                          'RootCaParameterName': param_root_ca,
                          'CertificateParameterName': param_cert
                      }, physicalResourceId=cert_id)

                  elif event['RequestType'] == 'Delete':
                      cert_id = event.get('PhysicalResourceId', '')
                      if cert_id and len(cert_id) == 64:
                          try:
                              iot.update_certificate(certificateId=cert_id, newStatus='INACTIVE')
                          except Exception:
                              pass
                          try:
                              iot.delete_certificate(certificateId=cert_id, forceDelete=True)
                          except Exception:
                              pass
                      # Delete the secret
                      try:
                          sm.delete_secret(
                              SecretId=f'iot/{thing_name}/device-credentials',
                              ForceDeleteWithoutRecovery=True
                          )
                      except Exception:
                          pass
                      # Delete SSM parameters
                      for param in [param_root_ca, param_cert]:
                          try:
                              ssm.delete_parameter(Name=param)
                          except Exception:
                              pass
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

                  else:
                      # Update - no-op, return existing
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {},
                                       physicalResourceId=event.get('PhysicalResourceId', ''))
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  IoTCertificate:
    Type: Custom::IoTCertificate
    Properties:
      ServiceToken: !GetAtt CertificateProvisionerFunction.Arn
    DependsOn: CertificateProvisionerRole

  # ─── Attach Policy to Certificate ───────────────────────────────────────
  IoTPolicyAttachment:
    Type: AWS::IoT::PolicyPrincipalAttachment
    Properties:
      PolicyName: !Ref IoTPolicy
      Principal: !GetAtt IoTCertificate.CertificateArn

  # ─── Attach Certificate to Thing ────────────────────────────────────────
  IoTThingCertAttachment:
    Type: AWS::IoT::ThingPrincipalAttachment
    Properties:
      ThingName: !Ref IoTThing
      Principal: !GetAtt IoTCertificate.CertificateArn

  # ─── CloudWatch Log Group for Telemetry ─────────────────────────────────
  TelemetryLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateTelemetryRule
    Properties:
      LogGroupName: !Sub '/aws/iot/${ThingName}/telemetry'
      RetentionInDays: !Ref TelemetryLogGroupRetentionDays

  # ─── CloudWatch Log Group for Lifecycle ─────────────────────────────────
  LifecycleLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateLifecycleRule
    Properties:
      LogGroupName: !Sub '/aws/iot/${ThingName}/lifecycle'
      RetentionInDays: !Ref TelemetryLogGroupRetentionDays

  # ─── IAM Role for IoT Rules ─────────────────────────────────────────────
  IoTRuleRole:
    Type: AWS::IAM::Role
    Condition: CreateTelemetryRule
    Properties:
      RoleName: !Sub '${ThingName}-iot-rule-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/iot/${ThingName}/*'

  # ─── IoT Rule: Route Telemetry to CloudWatch Logs ───────────────────────
  TelemetryRule:
    Type: AWS::IoT::TopicRule
    Condition: CreateTelemetryRule
    Properties:
      RuleName: 'esp32_pqc_telemetry_rule'
      TopicRulePayload:
        Description: >
          Routes device telemetry from dt/<thingName>/telemetry to CloudWatch Logs
          for monitoring and debugging.
        Sql: !Sub "SELECT *, timestamp() as server_timestamp FROM 'dt/${ThingName}/telemetry'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - CloudwatchLogs:
              LogGroupName: !Ref TelemetryLogGroup
              RoleArn: !GetAtt IoTRuleRole.Arn
    DependsOn: TelemetryLogGroup

  # ─── IoT Rule: Route Lifecycle Events to CloudWatch Logs ────────────────
  LifecycleRule:
    Type: AWS::IoT::TopicRule
    Condition: CreateLifecycleRule
    Properties:
      RuleName: 'esp32_pqc_lifecycle_rule'
      TopicRulePayload:
        Description: >
          Routes device lifecycle events (online/offline) from
          dt/<thingName>/lifecycle to CloudWatch Logs for presence tracking.
        Sql: !Sub "SELECT *, timestamp() as server_timestamp FROM 'dt/${ThingName}/lifecycle'"
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Actions:
          - CloudwatchLogs:
              LogGroupName: !Ref LifecycleLogGroup
              RoleArn: !GetAtt IoTRuleRole.Arn
    DependsOn: LifecycleLogGroup

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ThingName:
    Description: IoT Thing name (use this as THINGNAME in secrets.h)
    Value: !Ref IoTThing

  ThingTypeName:
    Description: IoT Thing Type name for device grouping
    Value: !Ref IoTThingType

  ThingArn:
    Description: IoT Thing ARN
    Value: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:thing/${ThingName}'

  IoTEndpoint:
    Description: >
      IoT Data-ATS endpoint. Use this as AWS_IOT_ENDPOINT in secrets.h.
      Note: This is the account-level endpoint, retrieve it with:
      aws iot describe-endpoint --endpoint-type iot:Data-ATS
    Value: !Sub '${AWS::AccountId}-ats.iot.${AWS::Region}.amazonaws.com'

  CertificateArn:
    Description: >
      Certificate ARN. The certificate PEM and private key are stored in
      AWS Secrets Manager (see SecretName output).
    Value: !GetAtt IoTCertificate.CertificateArn

  CertificateId:
    Description: Certificate ID for CLI operations
    Value: !GetAtt IoTCertificate.CertificateId

  DeviceCredentialsSecret:
    Description: >
      Secrets Manager secret containing the device certificate and private key.
      Retrieve with: aws secretsmanager get-secret-value --secret-id <this-value>
    Value: !GetAtt IoTCertificate.SecretName

  RootCaParameter:
    Description: >
      SSM Parameter Store name containing the Amazon Root CA 1 PEM.
      Retrieve with: aws ssm get-parameter --name <this-value> --query Parameter.Value --output text
    Value: !GetAtt IoTCertificate.RootCaParameterName

  CertificatePemParameter:
    Description: >
      SSM Parameter Store name containing the device certificate PEM.
      Retrieve with: aws ssm get-parameter --name <this-value> --query Parameter.Value --output text
    Value: !GetAtt IoTCertificate.CertificateParameterName

  PolicyName:
    Description: IoT Policy name attached to the certificate
    Value: !Ref IoTPolicy

  TelemetryTopic:
    Description: MQTT topic where the device publishes telemetry
    Value: !Sub 'dt/${ThingName}/telemetry'

  LifecycleTopic:
    Description: MQTT topic for device online/offline lifecycle events (and LWT)
    Value: !Sub 'dt/${ThingName}/lifecycle'

  CommandTopic:
    Description: MQTT topic pattern for sending commands to the device
    Value: !Sub 'cmd/${ThingName}/request'

  TelemetryLogGroup:
    Condition: CreateTelemetryRule
    Description: CloudWatch Log Group receiving telemetry messages
    Value: !Ref TelemetryLogGroup

  LifecycleLogGroup:
    Condition: CreateLifecycleRule
    Description: CloudWatch Log Group receiving lifecycle events
    Value: !Ref LifecycleLogGroup
