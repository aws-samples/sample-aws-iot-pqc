AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop — Master Stack (nested stacks)
  
  Single-command deployment for the entire re:Invent builders session.
  Creates all AWS infrastructure: IoT Things, dashboard,
  IoT Rules, and supporting resources.
  
  Deploy with:
    aws cloudformation deploy \
      --template-file pqc-workshop-main.yaml \
      --stack-name pqc-workshop \
      --parameter-overrides DeviceCount=100 \
      --capabilities CAPABILITY_NAMED_IAM \
      --s3-bucket <your-cfn-template-bucket>

Parameters:
  DeviceCount:
    Type: Number
    Default: 100
    Description: Maximum number of ESP32 devices (for dashboard scaling, not pre-provisioning)
    MinValue: 1
    MaxValue: 100

  DeviceNamePrefix:
    Type: String
    Default: esp32-
    Description: Prefix for auto-registered device Thing names

  WorkshopInstanceName:
    Type: String
    Default: pqc-workshop-broker
    Description: >
      Base name used for the Builder-Pi SSM hybrid activation and related
      resource naming. (Formerly GreengrassThingName; Greengrass has been
      removed but the SSM activation still derives its resource names from this.)

  TemplateBucketName:
    Type: String
    Description: >
      S3 bucket containing nested templates and Lambda packages.
      For Workshop Studio: use the event assets bucket.
      For self-hosted: use the bucket created by package.sh.

  TemplateBucketPrefix:
    Type: String
    Default: pqc-workshop
    Description: >
      S3 key prefix for all workshop artifacts (templates, lambda zips, policies).
      Templates at: <prefix>/templates/
      Lambda zips at: <prefix>/lambda/

  # ─── Broker networking (required by the nested BrokerStack) ─────────────────
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the PQC broker (ECS Fargate + NLB) into.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two subnets in different AZs for the broker NLB and ECS tasks.

  # ─── Default device WiFi (used by the firmware build; overridable) ──────────
  DefaultWifiSsid:
    Type: String
    Default: changeme
    Description: Default WiFi SSID baked into device firmware builds.

  DefaultWifiPassword:
    Type: String
    NoEcho: true
    Default: changeme
    Description: Default WiFi password baked into device firmware builds.

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: PQC Broker (ECS Fargate + NLB + Private CA)
  # Deployed first — it creates the Private CA that the device-builder stack
  # needs to issue device certificates.
  # ═══════════════════════════════════════════════════════════════════════════
  BrokerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/broker-container-stack.yaml'
      Parameters:
        VpcId: !Ref VpcId
        SubnetIds: !Join [',', !Ref SubnetIds]
        IoTEndpoint: !Sub '${AWS::AccountId}-ats.iot.${AWS::Region}.amazonaws.com'
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Device Builder (builder API, CodeBuild, PQC migration)
  # Depends on BrokerStack: consumes the Private CA ARN + broker NLB endpoint
  # via native cross-stack references.
  # ═══════════════════════════════════════════════════════════════════════════
  DeviceBuilderStack:
    # Ordering after BrokerStack is enforced by the !GetAtt references below
    # (PrivateCAArn / BrokerEndpoint), so no explicit DependsOn is needed.
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/device-builder-stack.yaml'
      Parameters:
        PrivateCAArn: !GetAtt BrokerStack.Outputs.PrivateCAArn
        DefaultBrokerEndpoint: !GetAtt BrokerStack.Outputs.BrokerEndpoint
        IoTEndpoint: !Sub '${AWS::AccountId}-ats.iot.${AWS::Region}.amazonaws.com'
        DefaultWifiSsid: !Ref DefaultWifiSsid
        DefaultWifiPassword: !Ref DefaultWifiPassword
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Device Auto-Registration (JIT via IoT Rule + Lambda)
  # ═══════════════════════════════════════════════════════════════════════════
  DeviceStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/device-provisioning-stack.yaml'
      Parameters:
        DeviceNamePrefix: !Ref DeviceNamePrefix
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: SSM Hybrid Activation (Raspberry Pi remote access)
  # ═══════════════════════════════════════════════════════════════════════════
  SSMActivationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/ssm-hybrid-activation-stack.yaml'
      Parameters:
        WorkshopInstanceName: !Ref WorkshopInstanceName
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Dashboard (AppSync, DynamoDB, Lambdas, S3/CloudFront)
  # ═══════════════════════════════════════════════════════════════════════════
  DashboardStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/dashboard-stack.yaml'
      Parameters:
        DeviceCount: !Ref DeviceCount
        DeviceNamePrefix: !Ref DeviceNamePrefix
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

Outputs:
  # ─── Broker + Device Builder ────────────────────────────────────────────────
  BrokerEndpoint:
    Description: PQC broker NLB endpoint (devices connect here on port 8883)
    Value: !GetAtt BrokerStack.Outputs.BrokerEndpoint

  PrivateCAArn:
    Description: Private CA ARN issuing device certificates
    Value: !GetAtt BrokerStack.Outputs.PrivateCAArn

  BuilderApiEndpoint:
    Description: Builder-Pi REST API endpoint (register/deregister/firmware)
    Value: !GetAtt DeviceBuilderStack.Outputs.ApiEndpoint

  FirmwareImageBuilderProject:
    Description: >
      One-time CodeBuild project that builds the firmware Docker image.
      Run once after deploy: aws codebuild start-build --project-name <this>
    Value: !GetAtt DeviceBuilderStack.Outputs.ImageBuilderProjectName

  # ─── Devices ──────────────────────────────────────────────────────────────
  DeviceCount:
    Description: Number of ESP32 devices provisioned
    Value: !Ref DeviceCount

  DevicePolicyName:
    Description: Shared IoT Policy for ESP32 devices
    Value: !GetAtt DeviceStack.Outputs.DevicePolicyName

  # ─── Dashboard ────────────────────────────────────────────────────────────
  DashboardURL:
    Description: Dashboard URL (share this with attendees)
    Value: !GetAtt DashboardStack.Outputs.DashboardURL

  AppSyncEndpoint:
    Description: AppSync GraphQL endpoint
    Value: !GetAtt DashboardStack.Outputs.AppSyncEndpoint

  CognitoIdentityPoolId:
    Description: Cognito Identity Pool ID for dashboard
    Value: !GetAtt DashboardStack.Outputs.CognitoIdentityPoolId

  # ─── IoT Core ─────────────────────────────────────────────────────────────
  IoTEndpoint:
    Description: >
      IoT Core data endpoint. Retrieve exact value with:
      aws iot describe-endpoint --endpoint-type iot:Data-ATS
    Value: !Sub '${AWS::AccountId}-ats.iot.${AWS::Region}.amazonaws.com'

  DashboardBucketName:
    Description: S3 bucket for dashboard static files
    Value: !GetAtt DashboardStack.Outputs.DashboardBucketName

  # ─── SSM Hybrid Activation ────────────────────────────────────────────────
  SSMActivationSecretName:
    Description: >
      Secrets Manager secret with SSM activation credentials.
      Use on Pi: ./setup-ssm-agent.sh <region> <stack-name>
    Value: !GetAtt SSMActivationStack.Outputs.SSMActivationSecretName

  SSMActivationId:
    Description: SSM Hybrid Activation ID
    Value: !GetAtt SSMActivationStack.Outputs.SSMActivationId
