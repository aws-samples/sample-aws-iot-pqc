AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop — Master Stack (nested stacks)
  
  Single-command deployment for the entire re:Invent builders session.
  Creates all AWS infrastructure: IoT Things, dashboard,
  IoT Rules, and supporting resources.
  
  Deploy with:
    aws cloudformation deploy \
      --template-file pqc-workshop-main.yaml \
      --stack-name pqc-workshop \
      --parameter-overrides DeviceCount=100 \
      --capabilities CAPABILITY_NAMED_IAM \
      --s3-bucket <your-cfn-template-bucket>

Parameters:
  DeviceCount:
    Type: Number
    Default: 100
    Description: Maximum number of ESP32 devices (for dashboard scaling, not pre-provisioning)
    MinValue: 1
    MaxValue: 100

  DeviceNamePrefix:
    Type: String
    Default: esp32-
    Description: Prefix for auto-registered device Thing names

  WorkshopInstanceName:
    Type: String
    Default: pqc-workshop-broker
    Description: >
      Base name used for the Builder-Pi SSM hybrid activation and related
      resource naming. (Formerly GreengrassThingName; Greengrass has been
      removed but the SSM activation still derives its resource names from this.)

  TemplateBucketName:
    Type: String
    Description: >
      S3 bucket containing nested templates and Lambda packages.
      For Workshop Studio: use the event assets bucket.
      For self-hosted: use the bucket created by package.sh.

  TemplateBucketPrefix:
    Type: String
    Default: pqc-workshop
    Description: >
      S3 key prefix for all workshop artifacts (templates, lambda zips, policies).
      Templates at: <prefix>/templates/
      Lambda zips at: <prefix>/lambda/

  # ─── Broker networking ──────────────────────────────────────────────────────
  CreateVpc:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      When 'true' (default), the stack creates its own VPC (2 public subnets, 2
      AZs, IGW) via the nested network stack and ignores VpcId/SubnetIds. Set
      'false' to bring your own VPC — then VpcId + SubnetIds are required.

  VpcId:
    Type: String
    Default: ''
    Description: >
      Existing VPC id for the broker (only used when CreateVpc=false). Leave
      empty when CreateVpc=true.

  SubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Existing subnet ids (>=2, two AZs) for the broker (only used when
      CreateVpc=false). Leave empty when CreateVpc=true.

  BrokerRouteTableIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Route table IDs for the broker's S3 gateway VPC endpoint (only used when
      CreateVpc=false). When CreateVpc=true the created (private) route table is
      used automatically. Leave empty to skip the S3 gateway endpoint.

  BrokerTaskSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Private (NAT-routed) subnet ids for the Fargate broker task (only used
      when CreateVpc=false). Strongly recommended in accounts with VPC Block
      Public Access enabled, so the broker egresses to IoT Core via NAT rather
      than a public IP. Leave empty to run the task in the public SubnetIds
      (only safe when Block Public Access is off).

  BrokerCreateVpcEndpoints:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Create VPC endpoints (ECR/Secrets Manager/Logs interface + S3 gateway) for
      the broker task to reach AWS service APIs over private networking. Default
      'false': the broker task runs in private subnets that egress via the NAT
      gateway, which already reaches ECR/Secrets Manager/Logs/S3 over the public
      AWS endpoints, so the interface endpoints are redundant (and cost ~8 ENIs).
      Set 'true' only if you must avoid NAT egress to the AWS APIs.

  # ─── Default device WiFi (used by the firmware build; overridable) ──────────
  DefaultWifiSsid:
    Type: String
    Default: changeme
    Description: >
      Workshop WiFi SSID baked into device firmware builds (initial flash AND
      the classical->PQC migration). Single source of truth for the device
      WiFi; the builder-Pi hostapd AP broadcasts this same SSID. Do NOT commit
      the real value: the operator supplies it at deploy time via the
      WORKSHOP_WIFI_SSID env var, which deploy-workshop.sh passes as an override.

  DefaultWifiPassword:
    Type: String
    NoEcho: true
    Default: changeme
    Description: >
      Workshop WiFi password (WPA2 PSK, 8-63 chars) baked into device firmware.
      Used for both initial flash and migration so a migrated device rejoins the
      same network; must match the builder-Pi hostapd AP password. Do NOT commit
      the real value: the operator supplies it at deploy time via the
      WORKSHOP_WIFI_PASSWORD env var, which deploy-workshop.sh passes as an
      override.

  IoTEndpoint:
    Type: String
    Default: ''
    Description: >
      AWS IoT Core data endpoint (iot:Data-ATS), e.g.
      a2ftry130vkg2k-ats.iot.us-east-1.amazonaws.com. This is account-specific
      and CANNOT be derived from the account id — it must be resolved with
      `aws iot describe-endpoint --endpoint-type iot:Data-ATS` and passed in
      (deploy-workshop.sh does this). Used by the broker's IoT-Core bridge and
      threaded to the device-builder. If left empty the deploy will fail fast
      rather than bake a non-resolving endpoint.

  BrokerTriggerBuild:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Whether the broker stack builds its container image during stack create.
      Kept 'false' for the orchestrated deploy: the broker's CodeBuild source
      (the Docker build context) must be uploaded to the broker source bucket
      AFTER the bucket exists, so deploy-workshop.sh stages the source and
      triggers the image build as a post-deploy step. Set 'true' only if the
      source is already staged before deploy.

  DashboardTriggerBuild:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Whether the dashboard stack builds + deploys the v2 dashboard via CodeBuild
      during stack create. Kept 'false' for the orchestrated deploy: the build
      source (the Vite frontend) must be uploaded to the dashboard source bucket
      AFTER the bucket exists, so deploy-workshop.sh stages the source and
      triggers the dashboard build as a post-deploy step (mirrors the broker
      image build). Set 'true' only if the source is already staged before deploy.

Conditions:
  ShouldCreateVpc: !Equals [!Ref CreateVpc, 'true']
  HasBrokerTaskSubnets: !Not [!Equals [!Join ['', !Ref BrokerTaskSubnetIds], '']]

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Network (self-contained VPC) — created only when CreateVpc=true
  # ═══════════════════════════════════════════════════════════════════════════
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldCreateVpc
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/network-stack.yaml'
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: PQC Broker (ECS Fargate + NLB + Private CA)
  # Deployed first — it creates the Private CA that the device-builder stack
  # needs to issue device certificates. Uses the created VPC (NetworkStack) when
  # CreateVpc=true, otherwise the supplied VpcId/SubnetIds.
  # ═══════════════════════════════════════════════════════════════════════════
  BrokerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/broker-container-stack.yaml'
      Parameters:
        VpcId: !If [ShouldCreateVpc, !GetAtt NetworkStack.Outputs.VpcId, !Ref VpcId]
        # Public subnets host the internet-facing NLB (devices connect here).
        SubnetIds: !If [ShouldCreateVpc, !GetAtt NetworkStack.Outputs.SubnetIds, !Join [',', !Ref SubnetIds]]
        # Private (NAT-routed) subnets host the Fargate broker task so it egresses
        # to IoT Core via NAT and works under VPC Block Public Access. In BYOVPC
        # mode, fall back to the public SubnetIds if no private subnets are given.
        TaskSubnetIds: !If
          - ShouldCreateVpc
          - !GetAtt NetworkStack.Outputs.PrivateSubnetIds
          - !If [HasBrokerTaskSubnets, !Join [',', !Ref BrokerTaskSubnetIds], !Join [',', !Ref SubnetIds]]
        # S3 gateway endpoint must attach to the task's route table (private in
        # the create-VPC path).
        RouteTableIds: !If [ShouldCreateVpc, !GetAtt NetworkStack.Outputs.PrivateRouteTableId, !Join [',', !Ref BrokerRouteTableIds]]
        IoTEndpoint: !Ref IoTEndpoint
        TriggerBuild: !Ref BrokerTriggerBuild
        CreateVpcEndpoints: !Ref BrokerCreateVpcEndpoints
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Device Builder (builder API, CodeBuild, PQC migration)
  # Depends on BrokerStack: consumes the Private CA ARN + broker NLB endpoint
  # via native cross-stack references.
  # ═══════════════════════════════════════════════════════════════════════════
  DeviceBuilderStack:
    # Ordering after BrokerStack is enforced by the !GetAtt references below
    # (PrivateCAArn / BrokerEndpoint), so no explicit DependsOn is needed.
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/device-builder-stack.yaml'
      Parameters:
        PrivateCAArn: !GetAtt BrokerStack.Outputs.PrivateCAArn
        DefaultBrokerEndpoint: !GetAtt BrokerStack.Outputs.BrokerEndpoint
        IoTEndpoint: !Ref IoTEndpoint
        DefaultWifiSsid: !Ref DefaultWifiSsid
        DefaultWifiPassword: !Ref DefaultWifiPassword
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Device Auto-Registration (JIT via IoT Rule + Lambda)
  # ═══════════════════════════════════════════════════════════════════════════
  DeviceStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/device-provisioning-stack.yaml'
      Parameters:
        DeviceNamePrefix: !Ref DeviceNamePrefix
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: SSM Hybrid Activation (Raspberry Pi remote access)
  # ═══════════════════════════════════════════════════════════════════════════
  SSMActivationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/ssm-hybrid-activation-stack.yaml'
      Parameters:
        WorkshopInstanceName: !Ref WorkshopInstanceName
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

  # ═══════════════════════════════════════════════════════════════════════════
  # Nested Stack: Dashboard (AppSync, DynamoDB, Lambdas, S3/CloudFront)
  # ═══════════════════════════════════════════════════════════════════════════
  DashboardStack:
    # Explicit dependency: the dashboard's migrateFirmware resolver targets the
    # StartMigration Lambda created by DeviceBuilderStack. We pass that Lambda's
    # ARN in as a parameter below, and DependsOn ensures DeviceBuilderStack (and
    # thus the Lambda) exists before the dashboard is created/validated — so
    # CloudFormation early validation resolves the reference to an existing
    # resource instead of failing ResourceExistenceCheck.
    DependsOn: DeviceBuilderStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/${TemplateBucketPrefix}/templates/dashboard-stack.yaml'
      Parameters:
        DeviceCount: !Ref DeviceCount
        DeviceNamePrefix: !Ref DeviceNamePrefix
        StartMigrationFunctionArn: !GetAtt DeviceBuilderStack.Outputs.StartMigrationFunctionArn
        DashboardTriggerBuild: !Ref DashboardTriggerBuild
      Tags:
        - Key: Workshop
          Value: pqc-reinvent

Outputs:
  # ─── Broker + Device Builder ────────────────────────────────────────────────
  BrokerEndpoint:
    Description: PQC broker NLB endpoint (devices connect here on port 8883)
    Value: !GetAtt BrokerStack.Outputs.BrokerEndpoint

  PrivateCAArn:
    Description: Private CA ARN issuing device certificates
    Value: !GetAtt BrokerStack.Outputs.PrivateCAArn

  BuilderApiEndpoint:
    Description: Builder-Pi REST API endpoint (register/deregister/firmware)
    Value: !GetAtt DeviceBuilderStack.Outputs.ApiEndpoint

  FirmwareImageBuilderProject:
    Description: >
      One-time CodeBuild project that builds the firmware Docker image.
      Run once after deploy: aws codebuild start-build --project-name <this>
    Value: !GetAtt DeviceBuilderStack.Outputs.ImageBuilderProjectName

  # ─── Devices ──────────────────────────────────────────────────────────────
  DeviceCount:
    Description: Number of ESP32 devices provisioned
    Value: !Ref DeviceCount

  DevicePolicyName:
    Description: Shared IoT Policy for ESP32 devices
    Value: !GetAtt DeviceStack.Outputs.DevicePolicyName

  # ─── Dashboard ────────────────────────────────────────────────────────────
  DashboardURL:
    Description: Dashboard URL (share this with attendees)
    Value: !GetAtt DashboardStack.Outputs.DashboardURL

  AppSyncEndpoint:
    Description: AppSync GraphQL endpoint
    Value: !GetAtt DashboardStack.Outputs.AppSyncEndpoint

  CognitoIdentityPoolId:
    Description: Cognito Identity Pool ID for dashboard
    Value: !GetAtt DashboardStack.Outputs.CognitoIdentityPoolId

  # ─── IoT Core ─────────────────────────────────────────────────────────────
  IoTEndpoint:
    Description: >
      AWS IoT Core data endpoint (iot:Data-ATS), as passed to the stack. This is
      account-specific and is resolved by the deploy tooling via
      aws iot describe-endpoint --endpoint-type iot:Data-ATS (it is NOT derivable
      from the account id).
    Value: !Ref IoTEndpoint

  DashboardBucketName:
    Description: S3 bucket for dashboard static files
    Value: !GetAtt DashboardStack.Outputs.DashboardBucketName

  DashboardDistributionId:
    Description: CloudFront distribution ID for the dashboard (for cache invalidation)
    Value: !GetAtt DashboardStack.Outputs.DashboardDistributionId

  DashboardBuildProjectName:
    Description: CodeBuild project that builds + deploys the v2 dashboard
    Value: !GetAtt DashboardStack.Outputs.DashboardBuildProjectName

  DashboardSourceBucketName:
    Description: S3 bucket the deploy script stages the dashboard build source into
    Value: !GetAtt DashboardStack.Outputs.DashboardSourceBucketName

  # ─── SSM Hybrid Activation ────────────────────────────────────────────────
  SSMActivationSecretName:
    Description: >
      Secrets Manager secret with SSM activation credentials.
      Use on Pi: ./setup-ssm-agent.sh <region> <stack-name>
    Value: !GetAtt SSMActivationStack.Outputs.SSMActivationSecretName

  SSMActivationId:
    Description: SSM Hybrid Activation ID
    Value: !GetAtt SSMActivationStack.Outputs.SSMActivationId

  InstallAwscliDocumentName:
    Description: SSM document — install the AWS CLI (prerequisite, step 0)
    Value: !GetAtt SSMActivationStack.Outputs.InstallAwscliDocumentName

  InstallToolchainDocumentName:
    Description: SSM document — install the builder-Pi toolchain (step 1)
    Value: !GetAtt SSMActivationStack.Outputs.InstallToolchainDocumentName

  DeployAppDocumentName:
    Description: SSM document — deploy the builder-Pi app + assets (step 2)
    Value: !GetAtt SSMActivationStack.Outputs.DeployAppDocumentName

  ConfigureServiceDocumentName:
    Description: SSM document — configure the builder-Pi service, auto-start GUI (step 3)
    Value: !GetAtt SSMActivationStack.Outputs.ConfigureServiceDocumentName
