AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Full AWS infrastructure for the re:Invent PQC IoT Workshop.
  Provisions Greengrass core device, up to 100 ESP32 client devices,
  DynamoDB table, IoT Rules, AppSync GraphQL API, and supporting
  Lambda functions for a real-time dashboard.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  DeviceCount:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 100
    Description: >
      Number of ESP32 devices to provision (1-100).

  GreengrassCoreThingName:
    Type: String
    Default: pqc-workshop-greengrass-core
    Description: Name of the Greengrass core IoT Thing.
    AllowedPattern: '[a-zA-Z0-9_-]+'

  DeviceNamePrefix:
    Type: String
    Default: esp32-pqc-device
    Description: >
      Prefix for ESP32 device Thing names. Devices will be named
      <prefix>-01, <prefix>-02, etc.
    AllowedPattern: '[a-zA-Z0-9_-]+'

  DashboardDomainPrefix:
    Type: String
    Default: pqc-workshop
    Description: Prefix used for naming the AppSync API and related resources.

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. GREENGRASS CORE DEVICE
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Greengrass Core IoT Thing ───────────────────────────────────────────
  GreengrassCoreThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Ref GreengrassCoreThingName
      AttributePayload:
        Attributes:
          device_type: greengrass-core
          platform: raspberry-pi
          pqc_broker: mosquitto-oqs

  # ─── Greengrass Core IoT Policy ─────────────────────────────────────────
  GreengrassCorePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${GreengrassCoreThingName}-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Connect with core Thing name as client ID
          - Effect: Allow
            Action: iot:Connect
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${GreengrassCoreThingName}'
          # Greengrass internal topics
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Subscribe
              - iot:Receive
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/greengrass/*'
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/greengrass/*'
          # Bridge ESP32 device messages (dt/ and cmd/ topics)
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Subscribe
              - iot:Receive
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/dt/*'
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/dt/#'
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/*'
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/cmd/#'
          # Greengrass service actions
          - Effect: Allow
            Action: greengrass:*
            Resource: '*'

  # ─── Greengrass Token Exchange IAM Role ──────────────────────────────────
  GreengrassTokenExchangeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GreengrassCoreThingName}-token-exchange-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: credentials.iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GreengrassTokenExchangePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # IoT operations (scoped to this account/region)
              - Effect: Allow
                Action:
                  - iot:DescribeCertificate
                  - iot:Connect
                  - iot:Publish
                  - iot:Subscribe
                  - iot:Receive
                  - iot:GetThingShadow
                  - iot:UpdateThingShadow
                  - iot:DeleteThingShadow
                Resource:
                  - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:*'
              # S3 access for Greengrass component artifacts
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::greengrass-component-artifacts-${AWS::Region}-${AWS::AccountId}/*'
                  - 'arn:aws:s3:::*-greengrass-updates/*'
              # CloudWatch Logs for Greengrass
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/greengrass/*'

  # ─── IoT Role Alias for Token Exchange ──────────────────────────────────
  GreengrassRoleAlias:
    Type: AWS::IoT::RoleAlias
    Properties:
      RoleAlias: !Sub '${GreengrassCoreThingName}-role-alias'
      RoleArn: !GetAtt GreengrassTokenExchangeRole.Arn
      CredentialDurationSeconds: 3600

  # ─── Greengrass Core Certificate (Custom Resource) ──────────────────────
  GreengrassCertProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GreengrassCoreThingName}-cert-provisioner-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IoTCertAndSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateKeysAndCertificate
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:AttachThingPrincipal
                  - iot:DetachThingPrincipal
                  - iot:AttachPolicy
                  - iot:DetachPolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:iot/${GreengrassCoreThingName}/*'

  GreengrassCertProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${GreengrassCoreThingName}-cert-provisioner'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt GreengrassCertProvisionerRole.Arn
      Environment:
        Variables:
          THING_NAME: !Ref GreengrassCoreThingName
          POLICY_NAME: !Sub '${GreengrassCoreThingName}-policy'
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os
          import json

          def handler(event, context):
              iot = boto3.client('iot')
              sm = boto3.client('secretsmanager')
              thing_name = os.environ['THING_NAME']
              policy_name = os.environ['POLICY_NAME']
              try:
                  if event['RequestType'] == 'Create':
                      resp = iot.create_keys_and_certificate(setAsActive=True)
                      cert_arn = resp['certificateArn']
                      cert_id = resp['certificateId']
                      cert_pem = resp['certificatePem']
                      key_pem = resp['keyPair']['PrivateKey']
                      # Attach cert to Thing and Policy
                      iot.attach_thing_principal(thingName=thing_name, principal=cert_arn)
                      iot.attach_policy(policyName=policy_name, target=cert_arn)
                      # Store credentials in Secrets Manager
                      secret_value = json.dumps({
                          'certificatePem': cert_pem,
                          'privateKey': key_pem,
                          'certificateArn': cert_arn,
                          'certificateId': cert_id
                      })
                      sm.create_secret(
                          Name=f'iot/{thing_name}/greengrass-credentials',
                          Description=f'Greengrass core certificate and private key for {thing_name}',
                          SecretString=secret_value,
                          Tags=[
                              {'Key': 'Thing', 'Value': thing_name},
                              {'Key': 'ManagedBy', 'Value': 'CloudFormation'}
                          ]
                      )
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'CertificateArn': cert_arn,
                          'CertificateId': cert_id,
                          'SecretName': f'iot/{thing_name}/greengrass-credentials'
                      }, physicalResourceId=cert_id)
                  elif event['RequestType'] == 'Delete':
                      cert_id = event.get('PhysicalResourceId', '')
                      if cert_id and len(cert_id) == 64:
                          cert_arn = f'arn:aws:iot:{os.environ["AWS_REGION"]}:{boto3.client("sts").get_caller_identity()["Account"]}:cert/{cert_id}'
                          try:
                              iot.detach_thing_principal(thingName=thing_name, principal=cert_arn)
                          except Exception:
                              pass
                          try:
                              iot.detach_policy(policyName=policy_name, target=cert_arn)
                          except Exception:
                              pass
                          try:
                              iot.update_certificate(certificateId=cert_id, newStatus='INACTIVE')
                          except Exception:
                              pass
                          try:
                              iot.delete_certificate(certificateId=cert_id, forceDelete=True)
                          except Exception:
                              pass
                      try:
                          sm.delete_secret(
                              SecretId=f'iot/{thing_name}/greengrass-credentials',
                              ForceDeleteWithoutRecovery=True
                          )
                      except Exception:
                          pass
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {},
                                       physicalResourceId=event.get('PhysicalResourceId', ''))
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  GreengrassCoreCertificate:
    Type: Custom::IoTCertificate
    Properties:
      ServiceToken: !GetAtt GreengrassCertProvisionerFunction.Arn
    DependsOn:
      - GreengrassCoreThing
      - GreengrassCorePolicy
      - GreengrassCertProvisionerRole

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. ESP32 DEVICE PROVISIONING (BATCH)
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Shared IoT Policy for ESP32 Devices ────────────────────────────────
  # Devices connect locally to PQC Mosquitto broker; Mosquitto bridges to
  # IoT Core using Greengrass cert. This policy is for the logical Things.
  ESP32DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${DeviceNamePrefix}-shared-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Connect with device name as client ID
          - Effect: Allow
            Action: iot:Connect
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${DeviceNamePrefix}-*'
          # Publish telemetry and lifecycle
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/dt/${!iot:Connection.Thing.ThingName}/telemetry'
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/dt/${!iot:Connection.Thing.ThingName}/lifecycle'
          # Subscribe to command topics
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/cmd/${!iot:Connection.Thing.ThingName}/+'
          # Receive on command topics
          - Effect: Allow
            Action: iot:Receive
            Resource:
              - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/${!iot:Connection.Thing.ThingName}/*'

  # ─── Device Provisioner Lambda Role ─────────────────────────────────────
  DeviceProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DeviceNamePrefix}-provisioner-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IoTDeviceProvisioning
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateThing
                  - iot:DeleteThing
                  - iot:DescribeThing
                  - iot:ListThings
                  - iot:AddThingToThingGroup
                  - iot:RemoveThingFromThingGroup
                  - greengrass:BatchAssociateClientDeviceWithCoreDevice
                  - greengrass:BatchDisassociateClientDeviceFromCoreDevice
                Resource: '*'

  # ─── Device Provisioner Lambda Function ─────────────────────────────────
  DeviceProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${DeviceNamePrefix}-provisioner'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt DeviceProvisionerRole.Arn
      Environment:
        Variables:
          DEVICE_PREFIX: !Ref DeviceNamePrefix
          CORE_THING_NAME: !Ref GreengrassCoreThingName
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os
