AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop — Network stack. A self-contained VPC for the workshop so the
  deployment works in accounts with no usable default VPC (e.g. Workshop Studio /
  Control Tower accounts). Creates a VPC with two public subnets (for the
  internet-facing NLB) and two private subnets (for the Fargate broker task)
  across two AZs, an internet gateway, and a NAT gateway. The broker task
  egresses via the NAT gateway rather than a public IP + IGW, so it keeps
  working under VPC Block Public Access (block-ingress), which drops IGW return
  traffic to public-IP tasks. Outputs feed the broker stack (VpcId / public
  SubnetIds / private SubnetIds / route table ids).

Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR block for the workshop VPC.

  Subnet1Cidr:
    Type: String
    Default: 10.20.0.0/20
    Description: CIDR for the first public subnet.

  Subnet2Cidr:
    Type: String
    Default: 10.20.16.0/20
    Description: CIDR for the second public subnet.

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.20.32.0/20
    Description: CIDR for the first private subnet (Fargate broker task).

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.20.48.0/20
    Description: CIDR for the second private subnet (Fargate broker task).

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pqc-workshop-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: pqc-workshop-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ─── VPC Block Public Access exclusion ──────────────────────────────────────
  # Some accounts (e.g. Workshop Studio / Control Tower) enable account-level VPC
  # Block Public Access = block-ingress, which drops IGW traffic and breaks BOTH
  # workshop internet paths: the device -> internet-facing NLB INBOUND path
  # (times out) and, for public-IP tasks, egress return traffic. This exclusion
  # exempts the workshop VPC so the internet-facing broker NLB is reachable and
  # egress works. It is a harmless no-op on accounts WITHOUT BPA (AWS explicitly
  # allows creating exclusions when BPA is off), so this single unconditional
  # resource makes the deploy work in both BPA and non-BPA accounts — no manual
  # console/CLI step, no per-account branching.
  VpcBpaExclusion:
    Type: AWS::EC2::VPCBlockPublicAccessExclusion
    DependsOn: VpcGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayExclusionMode: allow-bidirectional
      Tags:
        - Key: Name
          Value: pqc-workshop-bpa-exclusion

  # ─── Two public subnets across two AZs (broker NLB + ECS tasks) ──────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref Subnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pqc-workshop-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref Subnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pqc-workshop-public-2

  # ─── Public route table + default route to the IGW ──────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: pqc-workshop-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  Subnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # ─── NAT gateway (in a public subnet) for private-subnet egress ─────────────
  # The Fargate broker task runs in the private subnets and egresses to the
  # public internet (AWS IoT Core data endpoint on 8883) via this NAT gateway.
  # NAT-sourced egress + its return traffic is NOT blocked by VPC Block Public
  # Access (block-ingress), unlike a public-IP task's IGW return traffic.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: pqc-workshop-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: pqc-workshop-nat

  # ─── Two private subnets across two AZs (Fargate broker task) ───────────────
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: pqc-workshop-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: pqc-workshop-private-2

  # ─── Private route table + default route to the NAT gateway ─────────────────
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: pqc-workshop-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

Outputs:
  VpcId:
    Description: The workshop VPC id
    Value: !Ref Vpc

  SubnetIds:
    Description: Comma-separated public subnet ids (two AZs) — internet-facing NLB
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]

  PrivateSubnetIds:
    Description: Comma-separated private subnet ids (two AZs) — Fargate broker task
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]

  RouteTableId:
    Description: Public route table id
    Value: !Ref PublicRouteTable

  PrivateRouteTableId:
    Description: Private route table id (for the broker S3 gateway VPC endpoint)
    Value: !Ref PrivateRouteTable
