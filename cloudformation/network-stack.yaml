AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop — Network stack. A self-contained VPC for the workshop so the
  deployment works in accounts with no usable default VPC (e.g. Workshop Studio /
  Control Tower accounts). Creates a VPC with two public subnets across two AZs,
  an internet gateway, and a public route table. Outputs feed the broker stack
  (VpcId / SubnetIds / RouteTableId).

Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR block for the workshop VPC.

  Subnet1Cidr:
    Type: String
    Default: 10.20.0.0/20
    Description: CIDR for the first public subnet.

  Subnet2Cidr:
    Type: String
    Default: 10.20.16.0/20
    Description: CIDR for the second public subnet.

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pqc-workshop-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: pqc-workshop-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ─── Two public subnets across two AZs (broker NLB + ECS tasks) ──────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref Subnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pqc-workshop-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref Subnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pqc-workshop-public-2

  # ─── Public route table + default route to the IGW ──────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: pqc-workshop-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  Subnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

Outputs:
  VpcId:
    Description: The workshop VPC id
    Value: !Ref Vpc

  SubnetIds:
    Description: Comma-separated public subnet ids (two AZs)
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]

  RouteTableId:
    Description: Public route table id (for the broker S3 gateway VPC endpoint)
    Value: !Ref PublicRouteTable
