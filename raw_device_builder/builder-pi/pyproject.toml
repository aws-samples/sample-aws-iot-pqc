[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-builder"
version = "1.0.0"
description = "Builder-Pi CLI + GUI for ESP32 PQC workshop device registration and flashing"
# Raspberry Pi OS bookworm ships 3.11 and trixie 3.13. A lower floor makes the
# lock keep old-Python branches (urllib3 1.26, cryptography 47) that carry CVEs.
requires-python = ">=3.11"
dependencies = [
    # Matches the 3.1 line the Pi has always run (deploy-app pinned flask==3.1.*).
    "flask>=3.1,<3.2",
    "boto3>=1.34",
    "requests>=2.28",
    "pyserial>=3.5",
    "esptool>=4.0",
]

[project.scripts]
workshop-builder = "cli:main"

[tool.setuptools]
# Flat layout: cli.py + device_manager.py modules and the builder_core package.
py-modules = ["cli", "device_manager"]
packages = ["builder_core"]

[project.optional-dependencies]
test = ["pytest>=8.0", "moto[all]>=5.0"]
