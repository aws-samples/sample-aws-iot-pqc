<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 PQC Device Builder</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>🔧 PQC Device Builder</h1>
        <p class="subtitle">ESP32 Production Line Registration</p>
    </header>

    <main>
        <!-- System Info Panel (read-only) -->
        <section class="settings-panel">
            <h2>⚙️ System Parameters</h2>
            <div class="settings-grid">
                <div class="setting">
                    <label>WiFi Network (SSID)</label>
                    <input type="text" id="wifi-ssid" value="resolving…" readonly>
                </div>
                <div class="setting">
                    <label>Broker Endpoint</label>
                    <input type="text" id="broker-endpoint" value="resolving…" readonly>
                </div>
                <div class="setting">
                    <label>API Endpoint</label>
                    <input type="text" id="api-endpoint" value="{{ config.api_endpoint }}" readonly>
                </div>
                <div class="setting">
                    <label>Region</label>
                    <input type="text" id="region" value="{{ config.region }}" readonly>
                </div>
            </div>
        </section>

        <!-- Device Slots -->
        <section class="devices-panel">
            <div class="devices-header">
                <h2>🔌 USB Devices</h2>
                <button onclick="scanPorts()">🔄 Rescan</button>
            </div>
            <div id="device-grid" class="device-grid">
                <div class="empty-state">
                    <p>No ESP32 devices detected. Plug in a device via USB.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>PQC Workshop — Device Builder Pipeline</p>
    </footer>

    <script>
        // Poll device status every 2 seconds
        setInterval(refreshDevices, 2000);

        async function refreshDevices() {
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();
                renderDevices(devices);
            } catch (err) {
                console.error('Failed to refresh devices:', err);
            }
        }

        // Small DOM helpers so device-supplied values (serials, progress lines,
        // error text) are set via textContent and never parsed as HTML. This
        // avoids assigning untrusted strings through innerHTML (XSS-shaped).
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined && text !== null) node.textContent = text;
            return node;
        }

        function actionButton(className, label, handler, port) {
            const btn = el('button', className, label);
            btn.addEventListener('click', () => handler(port));
            return btn;
        }

        function buildDeviceCard(device) {
            const card = el('div', `device-card ${device.status}`);

            const header = el('div', 'device-header');
            header.appendChild(el('span', 'port-badge', device.port));
            header.appendChild(el('span', `status-badge ${device.status}`, device.status));
            card.appendChild(header);

            const info = el('div', 'device-info');
            const addRow = (label, value) => {
                const row = el('div', 'info-row');
                row.appendChild(el('label', null, label));
                row.appendChild(el('span', null, value));
                info.appendChild(row);
            };
            addRow('Serial:', device.serialNumber || 'detecting...');
            addRow('Thing Name:', device.thingName || '—');
            addRow('Registered:', device.isRegistered ? '✅ Yes' : '❌ No');
            card.appendChild(info);

            if (device.status === 'ready' && !device.isRegistered) {
                card.appendChild(
                    actionButton('register-btn', '🚀 Register & Flash', registerDevice, device.port)
                );
            }

            if (device.isRegistered && (device.status === 'registered' || device.status === 'done')) {
                const actions = el('div', 'device-actions');
                actions.appendChild(actionButton('action-btn reflash', '🔄 Reflash', reflashDevice, device.port));
                actions.appendChild(actionButton('action-btn serial', '📟 Serial', openSerial, device.port));
                actions.appendChild(actionButton('action-btn deregister', '🗑️ Deregister', deregisterDevice, device.port));
                card.appendChild(actions);
            }

            if (device.status === 'error') {
                const actions = el('div', 'device-actions');
                if (device.isRegistered) {
                    actions.appendChild(actionButton('action-btn reflash', '🔄 Retry Flash', reflashDevice, device.port));
                    actions.appendChild(actionButton('action-btn serial', '📟 Serial', openSerial, device.port));
                    actions.appendChild(actionButton('action-btn deregister', '🗑️ Deregister', deregisterDevice, device.port));
                } else {
                    actions.appendChild(actionButton('action-btn reflash', '🚀 Retry Register & Flash', registerDevice, device.port));
                    actions.appendChild(actionButton('action-btn serial', '📟 Serial', openSerial, device.port));
                }
                card.appendChild(actions);
            }

            if (device.error) {
                card.appendChild(el('div', 'error-msg', `❌ ${device.error}`));
            }

            const log = el('div', 'progress-log');
            (device.progress || []).forEach(line => log.appendChild(el('div', 'log-line', line)));
            card.appendChild(log);

            return card;
        }

        function renderDevices(devices) {
            const grid = document.getElementById('device-grid');
            grid.replaceChildren();
            if (devices.length === 0) {
                const empty = el('div', 'empty-state');
                empty.appendChild(el('p', null, 'No ESP32 devices detected. Plug in a device via USB.'));
                grid.appendChild(empty);
                return;
            }
            devices.forEach(device => grid.appendChild(buildDeviceCard(device)));
        }

        async function registerDevice(port) {
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ port })
                });
                const result = await response.json();
                if (!result.success) {
                    alert(`Registration failed: ${result.error || result.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        async function deregisterDevice(port) {
            if (!confirm('Deregister this device? This will delete the IoT Thing, certificate, policy, and firmware.')) return;
            try {
                const response = await fetch('/api/deregister', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ port })
                });
                const result = await response.json();
                if (!result.success) {
                    alert(`Deregistration failed: ${result.error || result.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        async function reflashDevice(port) {
            if (!confirm('Reflash this device with the current firmware from S3?')) return;
            try {
                const response = await fetch('/api/reflash', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ port })
                });
                const result = await response.json();
                if (!result.success) {
                    alert(`Reflash failed: ${result.error || result.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        let serialWindow = null;
        let serialInterval = null;

        function openSerial(port) {
            // Open a popup with live serial output
            if (serialWindow && !serialWindow.closed) {
                serialWindow.close();
            }
            serialWindow = window.open('', 'serial', 'width=700,height=500,scrollbars=yes');
            serialWindow.document.write(`
                <html><head><title>Serial: ${port}</title>
                <style>
                    body { background: #0f172a; color: #e2e8f0; font-family: monospace; font-size: 12px; padding: 10px; margin: 0; }
                    #output { white-space: pre-wrap; }
                    .line { padding: 1px 0; border-bottom: 1px solid #1e293b; }
                </style></head>
                <body><div id="output">Connecting to ${port}...</div></body></html>
            `);

            // Poll serial output
            const encodedPort = port.substring(1); // remove leading /
            if (serialInterval) clearInterval(serialInterval);
            serialInterval = setInterval(async () => {
                if (serialWindow.closed) { clearInterval(serialInterval); return; }
                try {
                    const resp = await fetch('/api/serial/' + encodedPort);
                    const data = await resp.json();
                    const outputEl = serialWindow.document.getElementById('output');
                    if (outputEl && data.lines) {
                        outputEl.replaceChildren();
                        data.lines.forEach(l => {
                            const lineEl = serialWindow.document.createElement('div');
                            lineEl.className = 'line';
                            lineEl.textContent = l;
                            outputEl.appendChild(lineEl);
                        });
                        outputEl.scrollTop = outputEl.scrollHeight;
                    }
                } catch (e) {}
            }, 1000);
        }

        async function scanPorts() {
            try {
                await fetch('/api/scan', { method: 'POST' });
            } catch (err) {
                console.error('Scan failed:', err);
            }
        }

        async function loadSystemParams() {
            // Populate the read-only broker endpoint from SSM (single source of
            // truth). Display only — the operator does not edit or send it.
            try {
                const response = await fetch('/api/system-params');
                const params = await response.json();
                document.getElementById('wifi-ssid').value =
                    params.wifiSsid || '(unavailable — check SSM /pqc-workshop/wifi/ssid)';
                const brokerEl = document.getElementById('broker-endpoint');
                brokerEl.value = params.brokerEndpoint || '(unavailable — check SSM /pqc-workshop/broker/endpoint)';
            } catch (err) {
                console.error('Failed to load system params:', err);
                document.getElementById('wifi-ssid').value = '(unavailable)';
                document.getElementById('broker-endpoint').value = '(unavailable)';
            }
        }

        // Initial load
        refreshDevices();
        loadSystemParams();
    </script>
</body>
</html>
