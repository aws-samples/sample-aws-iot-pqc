AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop — Device Builder Pipeline. Registers raw ESP32 devices,
  compiles device-specific classical firmware (Firmware 0), and manages
  OTA updates (Firmware 1+ with PQC) via presigned S3 URLs.
  Certificates issued by the same Private CA as the broker container.

Parameters:
  FirmwareBucketName:
    Type: String
    Description: S3 bucket name prefix for compiled firmware artifacts
    Default: pqc-workshop-firmware

  DefaultWifiSsid:
    Type: String
    Description: Default WiFi SSID for devices
    Default: clarmouth-4-24

  DefaultWifiPassword:
    Type: String
    Description: >-
      Default WiFi password for devices. Used by the PQC upgrader Lambda as a
      fallback when the device registry entry lacks wifiPassword (the registry
      entry is recreated from telemetry, which does not carry the password).
    NoEcho: true
    Default: changeme

  DefaultBrokerEndpoint:
    Type: String
    Description: MQTT broker endpoint (NLB DNS or Pi IP for local testing)
    Default: '192.168.1.90'

  DefaultBrokerPort:
    Type: String
    Description: MQTT broker port
    Default: '8883'

  IoTEndpoint:
    Type: String
    Description: AWS IoT Core data endpoint
    Default: auxsw1j2tp0z6-ats.iot.us-east-1.amazonaws.com

  PrivateCAArn:
    Type: String
    Description: ARN of the Private CA (from broker-container stack) used to issue device certs

  BuilderPiInstanceId:
    Type: String
    Description: SSM Managed Instance ID of the builder Raspberry Pi
    Default: mi-0f2c31334f3e87c8b

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # ECR — Docker Image Repository for Build Environment
  # ═══════════════════════════════════════════════════════════════════════════

  BuildImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pqc-workshop-firmware-builder
      ImageScanningConfiguration:
        ScanOnPush: false
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":30},"action":{"type":"expire"}}]}

  # ═══════════════════════════════════════════════════════════════════════════
  # CodeBuild — Image Builder (one-time, builds Docker image with toolchain)
  # ═══════════════════════════════════════════════════════════════════════════

  ImageBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-image-builder
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImageBuilderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BuildImageRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'

  ImageBuilderProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-build-image
      Description: Builds Docker image with ESP32 arduino-cli toolchain (run once)
      ServiceRole: !GetAtt ImageBuilderRole.Arn
      Source:
        Type: S3
        Location: !Sub '${FirmwareBucketName}-${AWS::AccountId}/source/'
        BuildSpec: buildspec-image.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPO_URI
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-firmware-builder'
          - Name: FIRMWARE_BUCKET
            Value: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      TimeoutInMinutes: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # S3 — Firmware Artifact Bucket
  # ═══════════════════════════════════════════════════════════════════════════

  FirmwareBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # DynamoDB — Device Registry
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pqc-workshop-device-registry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serialNumber
          AttributeType: S
      KeySchema:
        - AttributeName: serialNumber
          KeyType: HASH

  # ═══════════════════════════════════════════════════════════════════════════
  # IAM — Device Registrar Lambda Role
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceRegistrarRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-device-registrar
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeviceRegistrarPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateThing
                  - iot:CreateKeysAndCertificate
                  - iot:AttachThingPrincipal
                  - iot:AttachPolicy
                  - iot:CreatePolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - acm-pca:IssueCertificate
                  - acm-pca:GetCertificate
                  - acm-pca:GetCertificateAuthorityCertificate
                Resource: !Ref PrivateCAArn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DeviceRegistryTable.Arn
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt FirmwareBuildProject.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/*'
              # Used by the PQC upgrader Lambda (which shares this role) to
              # publish the OTA command to cmd/<thing>/ota via IoT Core. Note
              # the IAM action is iot:Publish even though the SDK client is
              # iot-data; iot-data:Publish is not a valid action.
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/*'

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Device Registrar
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceRegistrarFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-device-registrar
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt DeviceRegistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          BUILD_PROJECT: !Ref FirmwareBuildProject
          IOT_ENDPOINT: !Ref IoTEndpoint
          DEFAULT_WIFI_SSID: !Ref DefaultWifiSsid
          DEFAULT_BROKER_ENDPOINT: !Ref DefaultBrokerEndpoint
          PRIVATE_CA_ARN: !Ref PrivateCAArn
      Code:
        ZipFile: |
          # Placeholder — deploy real code from lambda/device-registrar/index.py
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — PQC Upgrader
  # Triggered by the dashboard "Migrate to PQC" button (via AppSync
  # migrateFirmware). Builds the PQC firmware variant with the device's certs
  # and WiFi credentials, generates a presigned S3 URL, and publishes the
  # ota-update command to cmd/<thing>/ota. Shares the device-registrar role
  # (which grants iot:Publish, codebuild, acm-pca, dynamodb, s3).
  # Real code is deployed from lambda/pqc-upgrader/index.py.
  # ═══════════════════════════════════════════════════════════════════════════

  PqcUpgraderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-pqc-upgrader
      Runtime: python3.12
      Handler: index.handler
      # Builds PQC firmware synchronously and waits for CodeBuild (up to 5 min).
      Timeout: 360
      Role: !GetAtt DeviceRegistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          BUILD_PROJECT: !Ref FirmwareBuildProject
          IOT_ENDPOINT: !Ref IoTEndpoint
          PRIVATE_CA_ARN: !Ref PrivateCAArn
          DEFAULT_WIFI_SSID: !Ref DefaultWifiSsid
          DEFAULT_WIFI_PASSWORD: !Ref DefaultWifiPassword
          DEFAULT_BROKER_ENDPOINT: !Ref DefaultBrokerEndpoint
      Code:
        ZipFile: |
          # Placeholder — deploy real code from lambda/pqc-upgrader/index.py
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  # Allow AppSync to invoke the PQC upgrader Lambda (the dashboard stack's
  # migrateFirmware resolver targets this function).
  PqcUpgraderAppSyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PqcUpgraderFunction
      Action: lambda:InvokeFunction
      Principal: appsync.amazonaws.com

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Device Deregistrar
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceDeregistrarRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-device-deregistrar
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeviceDeregistrarPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:DeleteThing
                  - iot:DeletePolicy
                  - iot:ListThingPrincipals
                  - iot:DetachThingPrincipal
                  - iot:DetachPolicy
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:ListTargetsForPolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                Resource: !GetAtt DeviceRegistryTable.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'

  DeviceDeregistrarFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-device-deregistrar
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt DeviceDeregistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
      Code:
        ZipFile: |
          # Placeholder — deploy real code from lambda/device-deregistrar/index.py
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Firmware Pusher (generates presigned URLs for OTA)
  # ═══════════════════════════════════════════════════════════════════════════

  FirmwarePusherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-firmware-pusher
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FirmwarePusherPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource:
                  - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/*/ota'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt DeviceRegistryTable.Arn

  FirmwarePusherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-firmware-pusher
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt FirmwarePusherRole.Arn
      Environment:
        Variables:
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          IOT_ENDPOINT: !Ref IoTEndpoint
          REGISTRY_TABLE: !Ref DeviceRegistryTable
      Code:
        ZipFile: |
          # Placeholder — deploy real code from lambda/firmware-pusher/index.py
          def handler(event, context):
              return {'statusCode': 200, 'body': 'placeholder'}

  # ═══════════════════════════════════════════════════════════════════════════
  # API Gateway — Builder-Pi API
  # ═══════════════════════════════════════════════════════════════════════════

  BuilderApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: pqc-workshop-device-builder-api
      Description: API for device registration, deregistration, and firmware management

  # /register
  RegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BuilderApi
      ParentId: !GetAtt BuilderApi.RootResourceId
      PathPart: register

  RegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BuilderApi
      ResourceId: !Ref RegisterResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeviceRegistrarFunction.Arn}/invocations'

  # /deregister
  DeregisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BuilderApi
      ParentId: !GetAtt BuilderApi.RootResourceId
      PathPart: deregister

  DeregisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BuilderApi
      ResourceId: !Ref DeregisterResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeviceDeregistrarFunction.Arn}/invocations'

  # /firmware
  FirmwareResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BuilderApi
      ParentId: !GetAtt BuilderApi.RootResourceId
      PathPart: firmware

  FirmwareMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BuilderApi
      ResourceId: !Ref FirmwareResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FirmwarePusherFunction.Arn}/invocations'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RegisterMethod
      - DeregisterMethod
      - FirmwareMethod
    Properties:
      RestApiId: !Ref BuilderApi
      StageName: prod

  RegisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeviceRegistrarFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'

  DeregisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeviceDeregistrarFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'

  FirmwarePusherLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FirmwarePusherFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'

  # ═══════════════════════════════════════════════════════════════════════════
  # CodeBuild — Firmware Compilation
  # ═══════════════════════════════════════════════════════════════════════════

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-codebuild-firmware
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt FirmwareBucket.Arn
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BuildImageRepository.Arn

  FirmwareBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-firmware-build
      Description: Compiles classical ESP32 firmware with device-specific credentials
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: S3
        Location: !Sub '${FirmwareBucketName}-${AWS::AccountId}/source/'
        BuildSpec: buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-firmware-builder:latest'
        ImagePullCredentialsType: SERVICE_ROLE
        EnvironmentVariables:
          - Name: DEVICE_SERIAL
            Value: placeholder
          - Name: FIRMWARE_VERSION
            Value: '0.1.0'
          - Name: FIRMWARE_BUCKET
            Value: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          - Name: WIFI_SSID
            Value: !Ref DefaultWifiSsid
          - Name: WIFI_PASSWORD
            Value: changeme
          - Name: BROKER_ENDPOINT
            Value: !Ref DefaultBrokerEndpoint
          - Name: BROKER_PORT
            Value: !Ref DefaultBrokerPort
          - Name: IOT_ENDPOINT
            Value: !Ref IoTEndpoint
          - Name: CA_CERT
            Value: placeholder
          - Name: DEVICE_CERT
            Value: placeholder
          - Name: DEVICE_KEY
            Value: placeholder
      TimeoutInMinutes: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # SSM — Builder-Pi Access Role
  # ═══════════════════════════════════════════════════════════════════════════

  BuilderPiSsmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-builder-pi-ssm
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BuilderPiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource:
                  - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt FirmwareBuildProject.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt DeviceRegistryTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

Outputs:
  ApiEndpoint:
    Description: Builder API endpoint (set in builder-pi config.json)
    Value: !Sub 'https://${BuilderApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  PqcUpgraderFunctionArn:
    Description: PQC upgrader Lambda ARN (targeted by the dashboard migrateFirmware resolver)
    Value: !GetAtt PqcUpgraderFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PqcUpgraderFunctionArn'

  FirmwareBucketName:
    Description: S3 bucket for firmware artifacts
    Value: !Sub '${FirmwareBucketName}-${AWS::AccountId}'

  DeviceRegistryTableName:
    Description: DynamoDB device registry table
    Value: !Ref DeviceRegistryTable

  CodeBuildProjectName:
    Description: CodeBuild project for firmware compilation
    Value: !Ref FirmwareBuildProject

  ECRRepositoryUri:
    Description: ECR repository for the build image
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-firmware-builder'

  ImageBuilderProjectName:
    Description: CodeBuild project for building the Docker image (run once)
    Value: !Ref ImageBuilderProject

  PrivateCAArn:
    Description: Private CA ARN used for device certificates
    Value: !Ref PrivateCAArn

  BuilderPiInstanceId:
    Description: SSM Instance ID of the builder-pi
    Value: !Ref BuilderPiInstanceId
