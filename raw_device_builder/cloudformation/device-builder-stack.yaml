AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PQC Workshop — Device Builder Pipeline. Registers raw ESP32 devices,
  compiles device-specific classical firmware (Firmware 0), and manages
  OTA updates (Firmware 1+ with PQC) via presigned S3 URLs.
  Certificates issued by the same Private CA as the broker container.

Parameters:
  FirmwareBucketName:
    Type: String
    Description: S3 bucket name prefix for compiled firmware artifacts
    Default: pqc-workshop-firmware

  DefaultWifiSsid:
    Type: String
    Description: >-
      Workshop WiFi SSID for devices. In the master deploy this is passed down
      from the master DefaultWifiSsid (operator-supplied via WORKSHOP_WIFI_SSID).
      Do not commit a real value.
    Default: changeme

  DefaultWifiPassword:
    Type: String
    Description: >-
      Workshop WiFi password for devices. Persisted in the registry by the
      registrar and used by the PQC migration (prepare-build) as a fallback when
      the registry entry lacks wifiPassword. In the master deploy this is passed
      down from the master DefaultWifiPassword (operator-supplied via
      WORKSHOP_WIFI_PASSWORD). Do not commit a real value.
    NoEcho: true
    Default: changeme

  DefaultBrokerEndpoint:
    Type: String
    Description: >-
      MQTT broker endpoint (NLB DNS). In the master deploy this is passed from
      the broker stack; set it explicitly for a standalone device-builder deploy.
    Default: ''

  DefaultBrokerPort:
    Type: String
    Description: MQTT broker port
    Default: '8883'

  IoTEndpoint:
    Type: String
    Default: ''
    Description: >
      AWS IoT Core data endpoint (iot:Data-ATS). Account-specific; resolve with
      `aws iot describe-endpoint --endpoint-type iot:Data-ATS`. In the master
      deploy this is passed down from the master IoTEndpoint parameter.

  PrivateCAArn:
    Type: String
    Description: ARN of the Private CA (from broker-container stack) used to issue classical device certs

  MlDsaPrivateCAArn:
    Type: String
    Description: >-
      ARN of the ML-DSA-44 Private CA (from broker-container stack) used to issue
      post-quantum device certs for the pqc-mldsa firmware variant.

  BuilderPiInstanceId:
    Type: String
    Description: >-
      SSM Managed Instance ID of the builder Raspberry Pi (e.g. mi-0123456789abcdef0).
      Supply per deployment — the Pi's managed-instance ID is created when the Pi
      registers with SSM (see bundle-for-builder-pi.sh), so it is account/deploy
      specific and has no meaningful default.
    Default: ''

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # ECR — Docker Image Repository for Build Environment
  # ═══════════════════════════════════════════════════════════════════════════

  BuildImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pqc-workshop-firmware-builder
      ImageScanningConfiguration:
        ScanOnPush: false
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":30},"action":{"type":"expire"}}]}

  # ═══════════════════════════════════════════════════════════════════════════
  # CodeBuild — Image Builder (one-time, builds Docker image with toolchain)
  # ═══════════════════════════════════════════════════════════════════════════

  ImageBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-image-builder
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImageBuilderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BuildImageRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'

  ImageBuilderProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-build-image
      Description: Builds Docker image with ESP32 arduino-cli toolchain (run once)
      ServiceRole: !GetAtt ImageBuilderRole.Arn
      Source:
        Type: S3
        Location: !Sub '${FirmwareBucketName}-${AWS::AccountId}/source/'
        BuildSpec: buildspec-image.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPO_URI
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-firmware-builder'
          - Name: FIRMWARE_BUCKET
            Value: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      TimeoutInMinutes: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # S3 — Firmware Artifact Bucket
  # ═══════════════════════════════════════════════════════════════════════════

  FirmwareBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # DynamoDB — Device Registry
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pqc-workshop-device-registry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serialNumber
          AttributeType: S
      KeySchema:
        - AttributeName: serialNumber
          KeyType: HASH

  # ═══════════════════════════════════════════════════════════════════════════
  # IAM — Device Registrar Lambda Role
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceRegistrarRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-device-registrar
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeviceRegistrarPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateThing
                  - iot:CreateKeysAndCertificate
                  - iot:AttachThingPrincipal
                  - iot:AttachPolicy
                  - iot:CreatePolicy
                Resource: '*'
              # NOTE: acm-pca permissions moved to the CodeBuild role
              # (pqc-workshop-codebuild-firmware) — the firmware build now issues
              # the device cert itself (buildspec.yml), not these Lambdas.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DeviceRegistryTable.Arn
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt FirmwareBuildProject.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/*'
              # Used by the PQC upgrader Lambda (which shares this role) to
              # publish the OTA command to cmd/<thing>/ota via IoT Core. Note
              # the IAM action is iot:Publish even though the SDK client is
              # iot-data; iot-data:Publish is not a valid action.
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/*'
              # Read workshop config from SSM as the authoritative live source:
              # the WiFi (registrar bakes into initial flash; prepare-build into
              # the PQC migration) and the broker NLB endpoint. The WiFi password
              # is a SecureString, so allow kms:Decrypt scoped to the SSM service.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pqc-workshop/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Device Registrar
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceRegistrarFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-device-registrar
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt DeviceRegistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          BUILD_PROJECT: !Ref FirmwareBuildProject
          IOT_ENDPOINT: !Ref IoTEndpoint
          DEFAULT_WIFI_SSID: !Ref DefaultWifiSsid
          DEFAULT_WIFI_PASSWORD: !Ref DefaultWifiPassword
          # SSM is the authoritative live source; the DEFAULT_* envs are fallbacks.
          WIFI_SSM_PREFIX: /pqc-workshop/wifi
          BROKER_SSM_PARAM: /pqc-workshop/broker/endpoint
          DEFAULT_BROKER_ENDPOINT: !Ref DefaultBrokerEndpoint
      Code: ../lambda/device-registrar

  # ═══════════════════════════════════════════════════════════════════════════
  # PQC Migration — Step Functions workflow (replaces the synchronous
  # pqc-upgrader Lambda). The dashboard "Migrate to PQC" button invokes the
  # StartMigration Lambda (via AppSync), which starts this state machine:
  #   SetStatusBuilding -> PrepareBuild -> (WaitForBuild) -> SetStatusPushing
  #   -> PublishOta -> SetStatusRebooting, with a Catch -> SetStatusFailed.
  # The long build wait uses the CodeBuild .sync integration, so no Lambda
  # blocks on the build and AppSync never times out. Live progress is written to
  # the dashboard device table (migrationStatus), surfaced by the dashboard poll.
  # Lambda code is packaged from lambda/* by `aws cloudformation package`.
  # ═══════════════════════════════════════════════════════════════════════════

  # Work step 1: registry lookup, issue cert, start CodeBuild. Shares the
  # device-registrar role (acm-pca, codebuild, dynamodb, s3).
  PrepareBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-prepare-build
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt DeviceRegistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          BUILD_PROJECT: !Ref FirmwareBuildProject
          IOT_ENDPOINT: !Ref IoTEndpoint
          DEFAULT_WIFI_SSID: !Ref DefaultWifiSsid
          DEFAULT_WIFI_PASSWORD: !Ref DefaultWifiPassword
          # SSM is the authoritative live source; the DEFAULT_* envs are fallbacks.
          WIFI_SSM_PREFIX: /pqc-workshop/wifi
          BROKER_SSM_PARAM: /pqc-workshop/broker/endpoint
          DEFAULT_BROKER_ENDPOINT: !Ref DefaultBrokerEndpoint
      Code: ../lambda/prepare-build

  # Work step 2: presign regional S3 URL, publish cmd/<thing>/ota, mark registry.
  PublishOtaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-publish-ota
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt DeviceRegistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          IOT_ENDPOINT: !Ref IoTEndpoint
      Code: ../lambda/publish-ota

  # AppSync target: starts the state machine and returns immediately.
  StartMigrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-start-migration
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref PqcMigrationStateMachine

  StartMigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-start-migration
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt StartMigrationRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref PqcMigrationStateMachine
      Code: ../lambda/start-migration

  # Allow AppSync (dashboard migrateFirmware resolver) to invoke StartMigration.
  StartMigrationAppSyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StartMigrationFunction
      Action: lambda:InvokeFunction
      Principal: appsync.amazonaws.com

  # IAM role for the state machine: write migrationStatus to the dashboard
  # device table, run the build, invoke the two task Lambdas.
  PqcMigrationStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-pqc-migration
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MigrationOrchestration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:StopBuild
                Resource: !GetAtt FirmwareBuildProject.Arn
              # CodeBuild .sync uses an EventBridge managed rule to get build
              # completion. The rule name AWS creates is (singular) "Event":
              # StepFunctionsGetEventForCodeBuildStartBuildRule — grant with a
              # wildcard so it matches regardless of minor AWS naming variants.
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEvent*ForCodeBuildStartBuildRule'
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/pqc-workshop-devices'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt PrepareBuildFunction.Arn
                  - !GetAtt PublishOtaFunction.Arn

  PqcMigrationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: pqc-workshop-pqc-migration
      StateMachineType: STANDARD
      RoleArn: !GetAtt PqcMigrationStateMachineRole.Arn
      # ASL definition is inlined and templated. The ${...} tokens are resolved
      # by DefinitionSubstitutions; the $.xxx JSONPath tokens are left intact
      # because they are not of the ${..} form Fn::Sub interprets.
      DefinitionSubstitutions:
        DeviceTableName: pqc-workshop-devices
        BuildProjectName: !Ref FirmwareBuildProject
        PrepareBuildFunctionArn: !GetAtt PrepareBuildFunction.Arn
        PublishOtaFunctionArn: !GetAtt PublishOtaFunction.Arn
      DefinitionString: |
        {
          "Comment": "PQC migration workflow: build PQC firmware, push OTA, report live migrationStatus.",
          "StartAt": "SetStatusBuilding",
          "States": {
            "SetStatusBuilding": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DeviceTableName}",
                "Key": { "thingName": { "S.$": "$.thingName" } },
                "UpdateExpression": "SET migrationStatus = :s REMOVE migrationError",
                "ExpressionAttributeValues": { ":s": { "S": "building" } }
              },
              "ResultPath": null,
              "Next": "PrepareBuild",
              "Catch": [ { "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "SetStatusFailed" } ]
            },
            "PrepareBuild": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Comment": "Pass the requested firmware variant through. prepare-build defaults it to 'pqc' when absent (backward compatible) and echoes the resolved variant + version + per-device build env back. It does NOT start a build (WaitForBuild is the sole builder).",
              "Parameters": {
                "FunctionName": "${PrepareBuildFunctionArn}",
                "Payload": {
                  "thingName.$": "$.thingName",
                  "variant.$": "$.variant"
                }
              },
              "ResultSelector": {
                "thingName.$": "$.Payload.thingName",
                "serialNumber.$": "$.Payload.serialNumber",
                "variant.$": "$.Payload.variant",
                "version.$": "$.Payload.version",
                "s3Key.$": "$.Payload.s3Key",
                "buildNeeded.$": "$.Payload.buildNeeded",
                "buildEnv.$": "$.Payload.buildEnv"
              },
              "ResultPath": "$.prepare",
              "Next": "BuildNeeded?",
              "Catch": [ { "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "SetStatusFailed" } ]
            },
            "BuildNeeded?": {
              "Type": "Choice",
              "Choices": [ { "Variable": "$.prepare.buildNeeded", "BooleanEquals": true, "Next": "WaitForBuild" } ],
              "Default": "SetStatusPushing"
            },
            "WaitForBuild": {
              "Type": "Task",
              "Resource": "arn:aws:states:::codebuild:startBuild.sync",
              "Parameters": {
                "ProjectName": "${BuildProjectName}",
                "EnvironmentVariablesOverride": [
                  { "Name": "DEVICE_SERIAL", "Value.$": "$.prepare.serialNumber", "Type": "PLAINTEXT" },
                  { "Name": "FIRMWARE_VERSION", "Value.$": "$.prepare.version", "Type": "PLAINTEXT" },
                  { "Name": "FIRMWARE_VARIANT", "Value.$": "$.prepare.variant", "Type": "PLAINTEXT" },
                  { "Name": "WIFI_SSID", "Value.$": "$.prepare.buildEnv.wifiSsid", "Type": "PLAINTEXT" },
                  { "Name": "WIFI_PASSWORD", "Value.$": "$.prepare.buildEnv.wifiPassword", "Type": "PLAINTEXT" },
                  { "Name": "BROKER_ENDPOINT", "Value.$": "$.prepare.buildEnv.brokerEndpoint", "Type": "PLAINTEXT" },
                  { "Name": "IOT_ENDPOINT", "Value.$": "$.prepare.buildEnv.iotEndpoint", "Type": "PLAINTEXT" }
                ]
              },
              "ResultPath": null,
              "Next": "SetStatusPushing",
              "Catch": [ { "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "SetStatusFailed" } ]
            },
            "SetStatusPushing": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DeviceTableName}",
                "Key": { "thingName": { "S.$": "$.thingName" } },
                "UpdateExpression": "SET migrationStatus = :s",
                "ExpressionAttributeValues": { ":s": { "S": "pushing-ota" } }
              },
              "ResultPath": null,
              "Next": "PublishOta",
              "Catch": [ { "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "SetStatusFailed" } ]
            },
            "PublishOta": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PublishOtaFunctionArn}",
                "Payload": {
                  "thingName.$": "$.thingName",
                  "serialNumber.$": "$.prepare.serialNumber",
                  "s3Key.$": "$.prepare.s3Key",
                  "version.$": "$.prepare.version",
                  "variant.$": "$.prepare.variant"
                }
              },
              "ResultPath": "$.publish",
              "Next": "SetStatusRebooting",
              "Retry": [
                { "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"], "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0 },
                { "ErrorEquals": ["States.ALL"], "IntervalSeconds": 5, "MaxAttempts": 3, "BackoffRate": 2.0 }
              ],
              "Catch": [ { "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "SetStatusFailed" } ]
            },
            "SetStatusRebooting": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DeviceTableName}",
                "Key": { "thingName": { "S.$": "$.thingName" } },
                "UpdateExpression": "SET migrationStatus = :s",
                "ExpressionAttributeValues": { ":s": { "S": "rebooting" } }
              },
              "ResultPath": null,
              "Next": "Succeed"
            },
            "Succeed": { "Type": "Succeed" },
            "SetStatusFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${DeviceTableName}",
                "Key": { "thingName": { "S.$": "$.thingName" } },
                "UpdateExpression": "SET migrationStatus = :s, migrationError = :e",
                "ExpressionAttributeValues": {
                  ":s": { "S": "failed" },
                  ":e": { "S.$": "States.Format('{}', $.error.Cause)" }
                }
              },
              "ResultPath": null,
              "Next": "Fail"
            },
            "Fail": { "Type": "Fail", "Error": "PqcMigrationFailed", "Cause": "See migrationError on the device record." }
          }
        }

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Device Deregistrar
  # ═══════════════════════════════════════════════════════════════════════════

  DeviceDeregistrarRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-device-deregistrar
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeviceDeregistrarPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:DeleteThing
                  - iot:DeletePolicy
                  - iot:ListThingPrincipals
                  - iot:DetachThingPrincipal
                  - iot:DetachPolicy
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:ListTargetsForPolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                Resource: !GetAtt DeviceRegistryTable.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'

  DeviceDeregistrarFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-device-deregistrar
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt DeviceDeregistrarRole.Arn
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref DeviceRegistryTable
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
      Code: ../lambda/device-deregistrar

  # ═══════════════════════════════════════════════════════════════════════════
  # Lambda — Firmware Pusher (generates presigned URLs for OTA)
  # ═══════════════════════════════════════════════════════════════════════════

  FirmwarePusherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-firmware-pusher
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FirmwarePusherPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource:
                  - !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/cmd/*/ota'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt DeviceRegistryTable.Arn

  FirmwarePusherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pqc-workshop-firmware-pusher
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt FirmwarePusherRole.Arn
      Environment:
        Variables:
          FIRMWARE_BUCKET: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          IOT_ENDPOINT: !Ref IoTEndpoint
          REGISTRY_TABLE: !Ref DeviceRegistryTable
      Code: ../lambda/firmware-pusher

  # ═══════════════════════════════════════════════════════════════════════════
  # API Gateway — Builder-Pi API
  # ═══════════════════════════════════════════════════════════════════════════

  BuilderApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: pqc-workshop-device-builder-api
      Description: API for device registration, deregistration, and firmware management

  # /register
  RegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BuilderApi
      ParentId: !GetAtt BuilderApi.RootResourceId
      PathPart: register

  RegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BuilderApi
      ResourceId: !Ref RegisterResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeviceRegistrarFunction.Arn}/invocations'

  # /deregister
  DeregisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BuilderApi
      ParentId: !GetAtt BuilderApi.RootResourceId
      PathPart: deregister

  DeregisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BuilderApi
      ResourceId: !Ref DeregisterResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeviceDeregistrarFunction.Arn}/invocations'

  # /firmware
  FirmwareResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BuilderApi
      ParentId: !GetAtt BuilderApi.RootResourceId
      PathPart: firmware

  FirmwareMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BuilderApi
      ResourceId: !Ref FirmwareResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FirmwarePusherFunction.Arn}/invocations'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RegisterMethod
      - DeregisterMethod
      - FirmwareMethod
    Properties:
      RestApiId: !Ref BuilderApi
      StageName: prod

  RegisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeviceRegistrarFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'

  DeregisterLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeviceDeregistrarFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'

  FirmwarePusherLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FirmwarePusherFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'

  # ═══════════════════════════════════════════════════════════════════════════
  # CodeBuild — Firmware Compilation
  # ═══════════════════════════════════════════════════════════════════════════

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-codebuild-firmware
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt FirmwareBucket.Arn
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt BuildImageRepository.Arn
              # The firmware build now issues the device certificate itself
              # (buildspec.yml), from the classical CA (classical/pqc variants)
              # or the ML-DSA-44 CA (pqc-mldsa variant). Scoped to both CA ARNs.
              - Effect: Allow
                Action:
                  - acm-pca:IssueCertificate
                  - acm-pca:GetCertificate
                  - acm-pca:GetCertificateAuthorityCertificate
                Resource:
                  - !Ref PrivateCAArn
                  - !Ref MlDsaPrivateCAArn

  FirmwareBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pqc-workshop-firmware-build
      Description: Compiles classical ESP32 firmware with device-specific credentials
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: S3
        Location: !Sub '${FirmwareBucketName}-${AWS::AccountId}/source/'
        BuildSpec: buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-firmware-builder:latest'
        ImagePullCredentialsType: SERVICE_ROLE
        EnvironmentVariables:
          - Name: DEVICE_SERIAL
            Value: placeholder
          - Name: FIRMWARE_VERSION
            # Canonical classical version — matches VARIANT_CONFIG["classical"]
            # (prepare-build) and the device-registrar default. Overridden per
            # build by the migration state machine / registrar.
            Value: '1.0.0-classical'
          - Name: FIRMWARE_BUCKET
            Value: !Sub '${FirmwareBucketName}-${AWS::AccountId}'
          - Name: WIFI_SSID
            Value: !Ref DefaultWifiSsid
          - Name: WIFI_PASSWORD
            Value: !Ref DefaultWifiPassword
          - Name: BROKER_ENDPOINT
            Value: !Ref DefaultBrokerEndpoint
          - Name: BROKER_PORT
            Value: !Ref DefaultBrokerPort
          - Name: IOT_ENDPOINT
            Value: !Ref IoTEndpoint
          # The build issues the device cert itself (see buildspec.yml), so it
          # needs both CA ARNs rather than pre-minted cert/key material. The
          # classical CA signs classical/pqc device certs; the ML-DSA-44 CA
          # signs pqc-mldsa device certs. Selected per FIRMWARE_VARIANT.
          - Name: CA_ARN
            Value: !Ref PrivateCAArn
          - Name: MLDSA_CA_ARN
            Value: !Ref MlDsaPrivateCAArn
      TimeoutInMinutes: 15

  # ═══════════════════════════════════════════════════════════════════════════
  # SSM — Builder-Pi Access Role
  # ═══════════════════════════════════════════════════════════════════════════

  BuilderPiSsmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-workshop-builder-pi-ssm
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BuilderPiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FirmwareBucket.Arn
                  - !Sub '${FirmwareBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource:
                  - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BuilderApi}/*'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt FirmwareBuildProject.Arn
              # Read the workshop config params, incl. the WiFi SSID/password
              # the builder-Pi hostapd AP setup broadcasts. The password is a
              # SecureString, so allow kms:Decrypt scoped to the SSM service.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pqc-workshop/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt DeviceRegistryTable.Arn
              # Ship Builder-Pi flash/serial logs to a dedicated log group via
              # the CloudWatch agent (register/build stages already log to
              # CloudWatch via Lambda + CodeBuild; this closes the Pi-side gap).
              # Scoped to the builder-pi group for least privilege (C3).
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/pqc-workshop/builder-pi:*'

Outputs:
  ApiEndpoint:
    Description: Builder API endpoint (set in builder-pi config.json)
    Value: !Sub 'https://${BuilderApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  StartMigrationFunctionArn:
    Description: StartMigration Lambda ARN (targeted by the dashboard migrateFirmware resolver)
    Value: !GetAtt StartMigrationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StartMigrationFunctionArn'

  PqcMigrationStateMachineArn:
    Description: PQC migration Step Functions state machine ARN
    Value: !Ref PqcMigrationStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-PqcMigrationStateMachineArn'

  FirmwareBucketName:
    Description: S3 bucket for firmware artifacts
    Value: !Sub '${FirmwareBucketName}-${AWS::AccountId}'

  DeviceRegistryTableName:
    Description: DynamoDB device registry table
    Value: !Ref DeviceRegistryTable

  CodeBuildProjectName:
    Description: CodeBuild project for firmware compilation
    Value: !Ref FirmwareBuildProject

  ECRRepositoryUri:
    Description: ECR repository for the build image
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pqc-workshop-firmware-builder'

  ImageBuilderProjectName:
    Description: CodeBuild project for building the Docker image (run once)
    Value: !Ref ImageBuilderProject

  PrivateCAArn:
    Description: Private CA ARN used for device certificates
    Value: !Ref PrivateCAArn

  BuilderPiInstanceId:
    Description: SSM Instance ID of the builder-pi
    Value: !Ref BuilderPiInstanceId
