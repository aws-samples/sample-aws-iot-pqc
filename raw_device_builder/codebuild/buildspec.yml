version: 0.2

env:
  variables:
    FIRMWARE_VARIANT: "classical"
    # Board + options for every variant. PSRAM=opi enables the XIAO ESP32-S3's
    # 8 MB octal PSRAM (ESP32-S3R8): without it the board menu defaults to
    # PSRAM disabled and all heap comes from ~320 KB internal SRAM. With it,
    # allocations over 4 KB (CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL) go to PSRAM,
    # e.g. wolfSSL's ML-KEM/ML-DSA handshake buffers and the ML-DSA key.
    FQBN: "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=cdc,PSRAM=opi,DebugLevel=info,PartitionScheme=default_8MB"

phases:
  pre_build:
    commands:
      # One build per VARIANT per deployment (build-shared-firmware.sh starts
      # them): the image carries no device identity, so there is no serial.
      - echo "Preparing shared firmware ${FIRMWARE_VERSION} (variant ${FIRMWARE_VARIANT})..."
      - '[ -n "${FIRMWARE_VERSION}" ] || { echo "ERROR: FIRMWARE_VERSION is unset"; exit 1; }'
      # ─── Variant → {FIRMWARE_VARIANT define, default port} ──
      # One sketch (aws_iot_pqc_esp32/, a .ino plus .h/.cpp modules) builds
      # every variant; the generated secrets.h selects it with FIRMWARE_VARIANT
      # (see the sketch's variant_config.h, which fails the build if it is
      # unset or unknown).
      #
      # The image carries NO device identity: keys, certs, CA roots and WiFi
      # are issued by the separate device-identity job and flashed by the
      # Builder-Pi into the "certs" NVS partition, which the sketch reads at
      # boot. Each variant picks its own cert from there:
      #   classical / pqc  → classical device cert (ECDSA P-256), port 8883
      #   pqc-mldsa        → ML-DSA-44 device cert, port 8884
      - SKETCH_NAME="aws_iot_pqc_esp32"
      - |
        case "${FIRMWARE_VARIANT}" in
          pqc-mldsa)
            VARIANT_DEFINE="FW_VARIANT_PQC_MLDSA"
            DEFAULT_BROKER_PORT="8884"
            DEFAULT_SIGNER_ERA="classical"
            ;;
          pqc)
            VARIANT_DEFINE="FW_VARIANT_PQC"
            DEFAULT_BROKER_PORT="8883"
            DEFAULT_SIGNER_ERA="classical"
            ;;
          classical)
            VARIANT_DEFINE="FW_VARIANT_CLASSICAL"
            DEFAULT_BROKER_PORT="8883"
            DEFAULT_SIGNER_ERA=""
            ;;
          *)
            echo "ERROR: unknown FIRMWARE_VARIANT '${FIRMWARE_VARIANT}' (classical | pqc | pqc-mldsa)"; exit 1 ;;
        esac
      # OTA firmware-signing ERA (Workstreams 1 + 4). The signer era is a
      # property of the VERSION, not the build sketch: the ML-DSA-signer-era
      # variants (4.0.0-signer / 5.0.0-verified) build the SAME pqc-mldsa sketch
      # but are signed by the ML-DSA-44 signer. So the state machine passes the
      # authoritative SIGNER_ERA (from prepare-build VARIANT_CONFIG signer_era);
      # we only fall back to the per-sketch DEFAULT_SIGNER_ERA when the build was
      # started WITHOUT a SIGNER_ERA override (e.g. the registrar's classical
      # first-flash, which is unsigned anyway). Empty ⇒ no signature produced
      # (classical 1.0.0 USB/trusted-flash).
      - SIGNER_ERA="${SIGNER_ERA:-$DEFAULT_SIGNER_ERA}"
      - echo "signer_era=${SIGNER_ERA:-<none/unsigned>} (build_variant=${FIRMWARE_VARIANT})"
      # Human-readable OTA firmware-signature algorithm for the device to report
      # in telemetry (dashboard integrity badge). Derived from the signer era:
      # classical -> ECDSA-P256, mldsa -> ML-DSA-44, empty -> unsigned (USB/
      # trusted factory flash). Baked into secrets.h as FIRMWARE_OTA_SIG_ALG.
      - |
        case "${SIGNER_ERA}" in
          classical) OTA_SIG_ALG_DISPLAY="ECDSA-P256" ;;
          mldsa)     OTA_SIG_ALG_DISPLAY="ML-DSA-44" ;;
          *)         OTA_SIG_ALG_DISPLAY="unsigned" ;;
        esac
      - echo "ota_sig_alg_display=${OTA_SIG_ALG_DISPLAY}"
      - echo "variant=${FIRMWARE_VARIANT} define=${VARIANT_DEFINE} sketch=${SKETCH_NAME} defaultPort=${DEFAULT_BROKER_PORT}"
      - '[ -n "${BROKER_ENDPOINT}" ] || { echo "ERROR: BROKER_ENDPOINT is unset"; exit 1; }'
      - SKETCH_DIR="/tmp/firmware_build/$SKETCH_NAME"
      - mkdir -p "$SKETCH_DIR"
      # The whole sketch folder (.ino + .h/.cpp modules), staged by
      # deploy-workshop.sh with `aws s3 sync --delete`, so it is exactly the
      # repo's files with no stale modules. arduino-cli requires the folder
      # name to match the .ino name.
      - echo "Downloading firmware source from S3..." && aws s3 cp --recursive "s3://$FIRMWARE_BUCKET/source/firmware/$SKETCH_NAME/" "$SKETCH_DIR/"
      - '[ -f "$SKETCH_DIR/$SKETCH_NAME.ino" ] || { echo "ERROR: $SKETCH_NAME.ino missing from source/firmware/$SKETCH_NAME/"; exit 1; }'
      - rm -f "$SKETCH_DIR/secrets.h"
      - ls -la "$SKETCH_DIR/"
      # ─── Build-time overlays (firmware source, not toolchain) ───────────────
      # The wolfSSL compile-time config and the partition table are part of the
      # firmware source: overlay them into the library / board package from
      # source/ before compiling, so changing them needs no image rebuild.
      # Arduino compiles libraries in isolation (they cannot see the sketch
      # folder), so user_settings.h must sit in wolfSSL's src/. Fail closed if a
      # target is missing rather than silently compiling with a stale config.
      - WOLFSSL_SRC="/root/Arduino/libraries/wolfssl/src"
      - PARTITIONS_DIR="/root/.arduino15/packages/esp32/hardware/esp32/3.3.10/tools/partitions"
      - '[ -d "$WOLFSSL_SRC" ] && [ -d "$PARTITIONS_DIR" ] || { echo "ERROR: overlay target missing (image toolchain changed?)"; exit 1; }'
      - aws s3 cp "s3://$FIRMWARE_BUCKET/source/wolfssl_user_settings_arduino.h" "$WOLFSSL_SRC/user_settings.h"
      - aws s3 cp "s3://$FIRMWARE_BUCKET/source/partitions_pqc_workshop.csv" "$PARTITIONS_DIR/pqc_workshop.csv"
      - WOLFSSL_SETTINGS_SHA256=$(sha256sum "$WOLFSSL_SRC/user_settings.h" | cut -d' ' -f1)
      - PARTITIONS_SHA256=$(sha256sum "$PARTITIONS_DIR/pqc_workshop.csv" | cut -d' ' -f1)
      - echo "wolfSSL user_settings.h sha256=$WOLFSSL_SETTINGS_SHA256 partitions sha256=$PARTITIONS_SHA256"
      # Sanitize the broker endpoint: MQTT_BROKER_ENDPOINT must be a BARE host
      # (the sketch supplies the port separately via MQTT_BROKER_PORT). If the
      # value arrives with a ':port' suffix (e.g. from the GUI/registry), strip
      # it — otherwise the firmware does a DNS lookup of "host:port" and fails
      # ("DNS Failed ... error -54"). We ignore any parsed :port for port
      # selection (the variant decides the port — see below).
      - |
        case "$BROKER_ENDPOINT" in
          *:*) BROKER_ENDPOINT="${BROKER_ENDPOINT%:*}" ;;
        esac
      # Port selection: the BROKER PORT IS A PROPERTY OF THE VARIANT, not a
      # caller input. classical/pqc use the classical listener (8883);
      # pqc-mldsa uses the ML-DSA-44 listener (8884). DEFAULT_BROKER_PORT was set
      # per-variant above, so it is ALWAYS authoritative here.
      #
      # We deliberately do NOT honour the project's static BROKER_PORT env: it
      # defaults to 8883 for every build, so letting it "win" silently forced the
      # pqc-mldsa firmware onto 8883 — where the broker presents its CLASSICAL
      # server cert, which the device (trusting only the ML-DSA CA) cannot verify
      # (wolfSSL ASN_NO_SIGNER_E / -188). Bug caught on the pqc-a fw2->fw3
      # migration: the device booted v3 + ML-KEM but hit :8883 and the handshake
      # failed. The variant default is the single source of truth for the port.
      - BROKER_PORT="${DEFAULT_BROKER_PORT}"
      - echo "Broker endpoint (host)= $BROKER_ENDPOINT  port= $BROKER_PORT (from variant ${FIRMWARE_VARIANT})"
      # ─── secrets.h: non-secret build settings only ──────────────────────────
      # Despite the name, nothing secret goes in here any more. Device keys,
      # certs, CA roots (incl. the OTA signer trust roots) and WiFi live in the
      # "certs" NVS partition (see the sketch's loadDeviceIdentity), so this
      # image is the same for every device apart from these settings.
      - |
        cat > "$SKETCH_DIR/secrets.h" << SECRETS_CONFIG
        #ifndef SECRETS_H
        #define SECRETS_H
        // Generated by CodeBuild (variant ${FIRMWARE_VARIANT}). Contains no secrets.

        // Which variant this image is (see the sketch's variant_config.h).
        #define FIRMWARE_VARIANT ${VARIANT_DEFINE}

        // Canonical firmware version, injected from the build's FIRMWARE_VERSION
        // env (sourced from prepare-build VARIANT_CONFIG). This is the SINGLE
        // source of truth: the same value names the S3 artifact dir
        // (<serial>/<version>/), the OTA job, and the version the device reports
        // in telemetry — so the dashboard, the firmware bucket, and the device
        // all agree. secrets.h is included before the sketch's #ifndef-guarded
        // fallback #define, so this value always wins in a CodeBuild artifact.
        #define FIRMWARE_VERSION "$FIRMWARE_VERSION"

        // OTA firmware signature era (dashboard integrity badge). Derived from
        // the build's SIGNER_ERA: ECDSA-P256 (classical signer), ML-DSA-44
        // (ML-DSA signer), or unsigned (USB/trusted factory flash). Distinct
        // from the TLS cert signature (CERT_SIGNATURE_ALG in the sketch).
        #define FIRMWARE_OTA_SIG_ALG "$OTA_SIG_ALG_DISPLAY"

        #define LOG_LEVEL  3

        #define MQTT_BROKER_ENDPOINT "$BROKER_ENDPOINT"
        #define MQTT_BROKER_PORT     $BROKER_PORT

        #endif
        SECRETS_CONFIG
      - cat "$SKETCH_DIR/secrets.h"
      - ls -la "$SKETCH_DIR/"

  build:
    commands:
      - echo "Compiling ${FIRMWARE_VARIANT} firmware with pqc_workshop partition table..."
      - |
        arduino-cli compile \
          -b "$FQBN" \
          --build-property "build.partitions=pqc_workshop" \
          --build-property "upload.maximum_size=3670016" \
          --export-binaries \
          "$SKETCH_DIR"
      - echo "Build complete!"
      - BUILD_DIR="$SKETCH_DIR/build/esp32.esp32.XIAO_ESP32S3"
      - ls -la "$BUILD_DIR/"

  post_build:
    commands:
      - BUILD_DIR="$SKETCH_DIR/build/esp32.esp32.XIAO_ESP32S3"
      # Shared per-version output: every device migrating to this version gets
      # exactly these bytes and this signature.
      - S3_PREFIX="shared/$FIRMWARE_VERSION"
      - BIN_FILE=$(ls "$BUILD_DIR/"*.ino.bin 2>/dev/null | head -1)
      - MERGED_FILE=$(ls "$BUILD_DIR/"*.ino.merged.bin 2>/dev/null | head -1)
      - echo "Uploading firmware artifacts to s3://$FIRMWARE_BUCKET/$S3_PREFIX/..."
      - aws s3 cp "$BIN_FILE" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/firmware.bin"
      - aws s3 cp "$MERGED_FILE" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/firmware.merged.bin"
      # The Builder-Pi flashes these pieces (not firmware.merged.bin, which is
      # padded to 8 MB and would overwrite the "certs" partition), so they
      # are required.
      - aws s3 cp "$BUILD_DIR/"*.bootloader.bin "s3://$FIRMWARE_BUCKET/$S3_PREFIX/bootloader.bin"
      - aws s3 cp "$BUILD_DIR/"*.partitions.bin "s3://$FIRMWARE_BUCKET/$S3_PREFIX/partitions.bin"
      - aws s3 cp "$BUILD_DIR/boot_app0.bin" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/boot_app0.bin"
      # ─── OTA firmware SIGNING (Workstream 1) ────────────────────────────────
      # Sign firmware.bin with the STABLE per-era signer key from Secrets Manager
      # and upload firmware.bin.sig + the signer leaf cert. The device verifies
      # the signature against the signer leaf (shipped here), which chains to a
      # CA root in the device's "certs" NVS partition. Encodings proven in the
      # G2 spike:
      #   classical: ECDSA-P256 over the SHA-256 digest → DER SEQUENCE{r,s} ~71 B
      #              (`openssl dgst -sha256 -sign`; wolfSSL wc_ecc_verify_hash
      #              takes the DER directly, no raw r||s conversion).
      #   mldsa:     ML-DSA-44 over the RAW image (pure scheme, hashes internally)
      #              → fixed 2420 B (`openssl pkeyutl -sign -rawin`, OpenSSL 3.5).
      # SIGNER_ERA empty ⇒ unsigned (classical 1.0.0 USB-only); skip signing.
      - SIG_ALG=""
      - |
        if [ -z "${SIGNER_ERA}" ]; then
          echo "Variant ${FIRMWARE_VARIANT} is unsigned (USB/trusted-flash); skipping OTA signing."
        else
          SIGN_WORK="$(mktemp -d)"
          case "${SIGNER_ERA}" in
            classical)
              SIGNER_KEY_SECRET="${SIGNER_CLASSICAL_KEY_SECRET}"
              SIGNER_CERT_SECRET="${SIGNER_CLASSICAL_CERT_SECRET}"
              SIG_ALG="ecdsa-p256"
              SIGN_OPENSSL="openssl"
              ;;
            mldsa)
              SIGNER_KEY_SECRET="${SIGNER_MLDSA_KEY_SECRET}"
              SIGNER_CERT_SECRET="${SIGNER_MLDSA_CERT_SECRET}"
              SIG_ALG="mldsa44"
              SIGN_OPENSSL="/opt/openssl-3.5/bin/openssl"
              ;;
            *)
              echo "ERROR: unknown SIGNER_ERA '${SIGNER_ERA}'"; exit 1 ;;
          esac
          [ -n "${SIGNER_KEY_SECRET}" ] && [ -n "${SIGNER_CERT_SECRET}" ] || { echo "ERROR: signer secret ids unset for era ${SIGNER_ERA} (SIGNER_*_KEY_SECRET / SIGNER_*_CERT_SECRET)"; exit 1; }
          echo "Signing firmware.bin with ${SIG_ALG} signer (era ${SIGNER_ERA})..."
          aws secretsmanager get-secret-value --secret-id "${SIGNER_KEY_SECRET}" --query SecretString --output text > "$SIGN_WORK/signer.key"
          aws secretsmanager get-secret-value --secret-id "${SIGNER_CERT_SECRET}" --query SecretString --output text > "$SIGN_WORK/signer.crt"
          if [ "${SIG_ALG}" = "ecdsa-p256" ]; then
            "${SIGN_OPENSSL}" dgst -sha256 -sign "$SIGN_WORK/signer.key" -out "$SIGN_WORK/firmware.bin.sig" "$BIN_FILE"
          else
            "${SIGN_OPENSSL}" pkeyutl -sign -inkey "$SIGN_WORK/signer.key" -rawin -in "$BIN_FILE" -out "$SIGN_WORK/firmware.bin.sig"
          fi
          [ -s "$SIGN_WORK/firmware.bin.sig" ] || { echo "ERROR: empty signature produced"; exit 1; }
          echo "Signature: ${SIG_ALG}, $(wc -c < "$SIGN_WORK/firmware.bin.sig") bytes"
          aws s3 cp "$SIGN_WORK/firmware.bin.sig" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/firmware.bin.sig"
          aws s3 cp "$SIGN_WORK/signer.crt" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/signer.crt"
          # Scrub the signer private key from disk immediately after signing.
          rm -rf "$SIGN_WORK"
        fi
      - |
        cat > /tmp/build-metadata.json << EOF
        {
          "brokerEndpoint": "$BROKER_ENDPOINT",
          "brokerPort": $BROKER_PORT,
          "firmwareVersion": "$FIRMWARE_VERSION",
          "firmwareType": "${FIRMWARE_VARIANT}",
          "signed": $( [ -n "${SIG_ALG}" ] && echo true || echo false ),
          "sigAlg": "${SIG_ALG}",
          "buildId": "$CODEBUILD_BUILD_ID",
          "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "partitionTable": "pqc_workshop",
          "partitionsSha256": "$PARTITIONS_SHA256",
          "wolfsslSettingsSha256": "$WOLFSSL_SETTINGS_SHA256",
          "fqbn": "$FQBN"
        }
        EOF
      - aws s3 cp /tmp/build-metadata.json "s3://$FIRMWARE_BUCKET/$S3_PREFIX/metadata.json"
      - echo "All artifacts uploaded to s3://$FIRMWARE_BUCKET/$S3_PREFIX/"
