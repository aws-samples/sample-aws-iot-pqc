version: 0.2

env:
  variables:
    FIRMWARE_VARIANT: "classical"

phases:
  pre_build:
    commands:
      - echo "Preparing firmware source for device esp32-$DEVICE_SERIAL (variant ${FIRMWARE_VARIANT})..."
      # ─── Variant → {sketch, CA, key mode, default port} ──
      # Single source of truth for what each firmware variant means. Adding a
      # future variant is a data change here, not new code paths. The device
      # certificate is issued HERE in the build (not in the Lambda) via the
      # shared cert-issuer script, so the ML-DSA key never leaves this container
      # and both cert types share one code path. The signing algorithm is derived
      # from the key mode by the issuer (ec-p256→SHA256WITHECDSA, mldsa44→ML_DSA_44).
      #   classical / pqc  → classical ACM PCA (ECDSA P-256), port 8883
      #   pqc-mldsa        → ML-DSA-44 ACM PCA (ML-DSA-44 key + signature), port 8884
      - |
        case "${FIRMWARE_VARIANT}" in
          pqc-mldsa)
            SKETCH_NAME="aws_iot_pqc_esp32_v3_mldsa"
            CERT_CA_ARN="${MLDSA_CA_ARN}"
            CERT_KEY_MODE="mldsa44"
            DEFAULT_BROKER_PORT="8884"
            ;;
          pqc)
            SKETCH_NAME="aws_iot_pqc_esp32"
            CERT_CA_ARN="${CA_ARN}"
            CERT_KEY_MODE="ec-p256"
            DEFAULT_BROKER_PORT="8883"
            ;;
          *)
            FIRMWARE_VARIANT="classical"
            SKETCH_NAME="aws_iot_pqc_esp32_v1_classical"
            CERT_CA_ARN="${CA_ARN}"
            CERT_KEY_MODE="ec-p256"
            DEFAULT_BROKER_PORT="8883"
            ;;
        esac
      - echo "variant=${FIRMWARE_VARIANT} sketch=${SKETCH_NAME} ca=${CERT_CA_ARN} key=${CERT_KEY_MODE} defaultPort=${DEFAULT_BROKER_PORT}"
      - '[ -n "${CERT_CA_ARN}" ] || { echo "ERROR: no CA ARN for variant ${FIRMWARE_VARIANT} (CA_ARN/MLDSA_CA_ARN unset)"; exit 1; }'
      - SKETCH_DIR="/tmp/firmware_build/$SKETCH_NAME"
      - mkdir -p "$SKETCH_DIR"
      - echo "Downloading firmware source from S3..." && aws s3 cp "s3://$FIRMWARE_BUCKET/source/$SKETCH_NAME.ino" "$SKETCH_DIR/$SKETCH_NAME.ino"
      # Sanitize the broker endpoint: MQTT_BROKER_ENDPOINT must be a BARE host
      # (the sketch supplies the port separately via MQTT_BROKER_PORT). If the
      # value arrives with a ':port' suffix (e.g. from the GUI/registry), strip
      # it — otherwise the firmware does a DNS lookup of "host:port" and fails
      # ("DNS Failed ... error -54"). We ignore any parsed :port for port
      # selection (the variant decides the port — see below).
      - |
        case "$BROKER_ENDPOINT" in
          *:*) BROKER_ENDPOINT="${BROKER_ENDPOINT%:*}" ;;
        esac
      # Port selection: the BROKER PORT IS A PROPERTY OF THE VARIANT, not a
      # caller input. classical/pqc use the classical listener (8883);
      # pqc-mldsa uses the ML-DSA-44 listener (8884). DEFAULT_BROKER_PORT was set
      # per-variant above, so it is ALWAYS authoritative here.
      #
      # We deliberately do NOT honour the project's static BROKER_PORT env: it
      # defaults to 8883 for every build, so letting it "win" silently forced the
      # pqc-mldsa firmware onto 8883 — where the broker presents its CLASSICAL
      # server cert, which the device (trusting only the ML-DSA CA) cannot verify
      # (wolfSSL ASN_NO_SIGNER_E / -188). Bug caught on the pqc-a fw2->fw3
      # migration: the device booted v3 + ML-KEM but hit :8883 and the handshake
      # failed. The variant default is the single source of truth for the port.
      - BROKER_PORT="${DEFAULT_BROKER_PORT}"
      - echo "Broker endpoint (host)= $BROKER_ENDPOINT  port= $BROKER_PORT (from variant ${FIRMWARE_VARIANT})"
      # ─── Issue the device certificate from AWS Private CA (in-build) ─────────
      # All device-cert issuance happens HERE (not in the Lambda), so classical
      # and ML-DSA-44 share one path and the private key never leaves this build.
      #   ec-p256  → stock `openssl` (system 3.0.2 is fine for EC)
      #   mldsa44  → `/opt/openssl-3.5/bin/openssl` (ML-DSA is native in 3.5)
      - CERT_WORK="$(mktemp -d)"
      - THING_NAME="esp32-$DEVICE_SERIAL"
      # Mint the device cert via the SHARED cert-issuer script (baked into the
      # firmware-builder image at /opt/cert-issuer). Same code path as the broker
      # cert-issuer container: it generates the key + CSR (ML-DSA via OpenSSL 3.5
      # for mldsa44, EC via stock openssl for ec-p256), calls ACM PCA on the
      # variant's CA, and writes ca.crt / cert.crt / key.pem into CERT_WORK.
      - |
        if [ "$CERT_KEY_MODE" = "mldsa44" ]; then CERT_OU="IoT Device PQC ML-DSA"; else CERT_OU="IoT Device"; fi
      - echo "Issuing ${CERT_KEY_MODE} device cert from CA ${CERT_CA_ARN} via shared issuer..."
      - |
        python3 /opt/cert-issuer/issue_cert.py \
          --common-name "$THING_NAME" \
          --key-mode "$CERT_KEY_MODE" \
          --ca-arn "$CERT_CA_ARN" \
          --ou "$CERT_OU" \
          --idempotency-token "dev-$DEVICE_SERIAL" \
          --out-dir "$CERT_WORK"
      - DEVICE_CERT="$(cat "$CERT_WORK/cert.crt")"
      - DEVICE_KEY="$(cat "$CERT_WORK/key.pem")"
      - CA_CERT="$(cat "$CERT_WORK/ca.crt")"
      - '[ -n "$DEVICE_CERT" ] && [ -n "$DEVICE_KEY" ] && [ -n "$CA_CERT" ] || { echo "ERROR: empty cert material"; exit 1; }'
      - |
        cat > "$SKETCH_DIR/secrets.h" << 'SECRETS_HEADER'
        #ifndef SECRETS_H
        #define SECRETS_H
        SECRETS_HEADER
      - |
        cat >> "$SKETCH_DIR/secrets.h" << SECRETS_CONFIG
        // Generated by CodeBuild for device esp32-$DEVICE_SERIAL
        // Firmware version: $FIRMWARE_VERSION

        #define WIFI_SSID     "$WIFI_SSID"
        #define WIFI_PASSWORD "$WIFI_PASSWORD"
        #define LOG_LEVEL  3

        #define MQTT_BROKER_ENDPOINT "$BROKER_ENDPOINT"
        #define MQTT_BROKER_PORT     $BROKER_PORT

        #define AWS_IOT_ENDPOINT "$IOT_ENDPOINT"
        #define AWS_IOT_PORT     8883
        #define AWS_IOT_PUBLISH_TOPIC   "esp32/pqc/pub"
        #define AWS_IOT_SUBSCRIBE_TOPIC "esp32/pqc/sub"
        SECRETS_CONFIG
      - |
        echo "" >> "$SKETCH_DIR/secrets.h"
        echo "static const char AWS_CERT_CA[] PROGMEM = R\"EOF(" >> "$SKETCH_DIR/secrets.h"
        echo "$CA_CERT" >> "$SKETCH_DIR/secrets.h"
        echo ")EOF\";" >> "$SKETCH_DIR/secrets.h"
        echo "" >> "$SKETCH_DIR/secrets.h"
        echo "static const char AWS_CERT_CRT[] PROGMEM = R\"KEY(" >> "$SKETCH_DIR/secrets.h"
        echo "$DEVICE_CERT" >> "$SKETCH_DIR/secrets.h"
        echo ")KEY\";" >> "$SKETCH_DIR/secrets.h"
        echo "" >> "$SKETCH_DIR/secrets.h"
        echo "static const char AWS_CERT_PRIVATE[] PROGMEM = R\"KEY(" >> "$SKETCH_DIR/secrets.h"
        echo "$DEVICE_KEY" >> "$SKETCH_DIR/secrets.h"
        echo ")KEY\";" >> "$SKETCH_DIR/secrets.h"
        echo "" >> "$SKETCH_DIR/secrets.h"
        echo "#endif" >> "$SKETCH_DIR/secrets.h"
      - echo "secrets.h generated for esp32-$DEVICE_SERIAL"
      # Scrub the on-disk private key + CSR now that it is baked into secrets.h.
      - rm -rf "$CERT_WORK"
      - ls -la "$SKETCH_DIR/"

  build:
    commands:
      - echo "Compiling ${FIRMWARE_VARIANT} firmware with pqc_workshop partition table..."
      - |
        arduino-cli compile \
          -b "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=default,DebugLevel=info,PartitionScheme=default_8MB" \
          --build-property "build.partitions=pqc_workshop" \
          --build-property "upload.maximum_size=3670016" \
          --export-binaries \
          "$SKETCH_DIR"
      - echo "Build complete!"
      - BUILD_DIR="$SKETCH_DIR/build/esp32.esp32.XIAO_ESP32S3"
      - ls -la "$BUILD_DIR/"

  post_build:
    commands:
      - BUILD_DIR="$SKETCH_DIR/build/esp32.esp32.XIAO_ESP32S3"
      - S3_PREFIX="$DEVICE_SERIAL/$FIRMWARE_VERSION"
      - BIN_FILE=$(ls "$BUILD_DIR/"*.ino.bin 2>/dev/null | head -1)
      - MERGED_FILE=$(ls "$BUILD_DIR/"*.ino.merged.bin 2>/dev/null | head -1)
      - echo "Uploading firmware artifacts to s3://$FIRMWARE_BUCKET/$S3_PREFIX/..."
      - aws s3 cp "$BIN_FILE" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/firmware.bin"
      - aws s3 cp "$MERGED_FILE" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/firmware.merged.bin"
      - aws s3 cp "$BUILD_DIR/"*.bootloader.bin "s3://$FIRMWARE_BUCKET/$S3_PREFIX/bootloader.bin" || true
      - aws s3 cp "$BUILD_DIR/"*.partitions.bin "s3://$FIRMWARE_BUCKET/$S3_PREFIX/partitions.bin" || true
      - aws s3 cp "$BUILD_DIR/boot_app0.bin" "s3://$FIRMWARE_BUCKET/$S3_PREFIX/boot_app0.bin" || true
      - |
        cat > /tmp/build-metadata.json << EOF
        {
          "serialNumber": "$DEVICE_SERIAL",
          "thingName": "esp32-$DEVICE_SERIAL",
          "firmwareVersion": "$FIRMWARE_VERSION",
          "firmwareType": "${FIRMWARE_VARIANT}",
          "buildId": "$CODEBUILD_BUILD_ID",
          "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "partitionTable": "pqc_workshop",
          "fqbn": "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=default,DebugLevel=info,PartitionScheme=default_8MB"
        }
        EOF
      - aws s3 cp /tmp/build-metadata.json "s3://$FIRMWARE_BUCKET/$S3_PREFIX/metadata.json"
      - echo "All artifacts uploaded to s3://$FIRMWARE_BUCKET/$S3_PREFIX/"
