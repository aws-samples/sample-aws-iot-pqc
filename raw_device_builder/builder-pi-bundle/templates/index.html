<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 PQC Device Builder</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>🔧 PQC Device Builder</h1>
        <p class="subtitle">ESP32 Production Line Registration</p>
    </header>

    <main>
        <!-- Settings Panel -->
        <section class="settings-panel">
            <h2>⚙️ Settings</h2>
            <div class="settings-grid">
                <div class="setting">
                    <label>WiFi SSID</label>
                    <input type="text" id="wifi-ssid" value="{{ config.wifi_ssid }}">
                </div>
                <div class="setting">
                    <label>WiFi Password</label>
                    <input type="password" id="wifi-password" value="{{ config.wifi_password }}">
                </div>
                <div class="setting">
                    <label>Broker Endpoint</label>
                    <input type="text" id="broker-endpoint" value="{{ config.broker_endpoint }}">
                </div>
                <div class="setting">
                    <label>IoT Endpoint</label>
                    <input type="text" id="iot-endpoint" value="{{ config.iot_endpoint }}">
                </div>
                <div class="setting">
                    <label>Firmware Version</label>
                    <input type="text" id="firmware-version" value="{{ config.firmware_version }}">
                </div>
                <div class="setting">
                    <label>API Endpoint</label>
                    <input type="text" id="api-endpoint" value="{{ config.api_endpoint }}">
                </div>
            </div>
            <button id="save-settings" onclick="saveSettings()">💾 Save Settings</button>
        </section>

        <!-- Device Slots -->
        <section class="devices-panel">
            <div class="devices-header">
                <h2>🔌 USB Devices</h2>
                <button onclick="scanPorts()">🔄 Rescan</button>
            </div>
            <div id="device-grid" class="device-grid">
                <div class="empty-state">
                    <p>No ESP32 devices detected. Plug in a device via USB.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>PQC Workshop — Device Builder Pipeline</p>
    </footer>

    <script>
        // Poll device status every 2 seconds
        setInterval(refreshDevices, 2000);

        async function refreshDevices() {
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();
                renderDevices(devices);
            } catch (err) {
                console.error('Failed to refresh devices:', err);
            }
        }

        function renderDevices(devices) {
            const grid = document.getElementById('device-grid');
            if (devices.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No ESP32 devices detected. Plug in a device via USB.</p></div>';
                return;
            }

            grid.innerHTML = devices.map(device => `
                <div class="device-card ${device.status}">
                    <div class="device-header">
                        <span class="port-badge">${device.port}</span>
                        <span class="status-badge ${device.status}">${device.status}</span>
                    </div>
                    <div class="device-info">
                        <div class="info-row">
                            <label>Serial:</label>
                            <span>${device.serialNumber || 'detecting...'}</span>
                        </div>
                        <div class="info-row">
                            <label>Thing Name:</label>
                            <span>${device.thingName || '—'}</span>
                        </div>
                    </div>
                    ${device.status === 'ready' ? `
                        <button class="register-btn" onclick="registerDevice('${device.port}')">
                            🚀 Register & Flash
                        </button>
                    ` : ''}
                    ${device.error ? `<div class="error-msg">❌ ${device.error}</div>` : ''}
                    <div class="progress-log">
                        ${(device.progress || []).map(line => `<div class="log-line">${line}</div>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function registerDevice(port) {
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ port })
                });
                const result = await response.json();
                if (!result.success) {
                    alert(`Registration failed: ${result.error || result.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        async function scanPorts() {
            try {
                await fetch('/api/scan', { method: 'POST' });
            } catch (err) {
                console.error('Scan failed:', err);
            }
        }

        async function saveSettings() {
            const settings = {
                wifi_ssid: document.getElementById('wifi-ssid').value,
                wifi_password: document.getElementById('wifi-password').value,
                broker_endpoint: document.getElementById('broker-endpoint').value,
                iot_endpoint: document.getElementById('iot-endpoint').value,
                firmware_version: document.getElementById('firmware-version').value,
                api_endpoint: document.getElementById('api-endpoint').value
            };
            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(settings)
                });
                const result = await response.json();
                if (result.success) {
                    alert('Settings saved!');
                }
            } catch (err) {
                alert(`Save failed: ${err.message}`);
            }
        }

        // Initial load
        refreshDevices();
    </script>
</body>
</html>
